# Windows 平台构建与依赖记录（tasks.md T005/T020/T021；V-001、V-002）
#
# 平台结论（M0）：Go——本机已取得完整实测证据（见 artifacts/m0-report.md）。
#
# 工具链纪律（D-01 修订）：Windows 验收使用 runner 默认的 x86_64-pc-windows-msvc；
# **不使用任何 GNU 工具链**。rust-toolchain.toml 只锁版本号（1.99.1），host triple 由
# runner 默认值决定。
#
# 构建前置：DuckDB 采用官方预编译动态库（ADR-DB-BUILD），任何构建前必须先执行
# ci/fetch-duckdb.py 拉取并校验 SHA256，否则链接阶段显式失败。
name: platform-windows

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-deps-record:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: 显示锁定工具链（rust-toolchain.toml）
        run: rustup show

      - name: 拉取并校验预编译 DuckDB（ADR-DB-BUILD）
        run: python ci/fetch-duckdb.py

      - name: 构建（锁定依赖图）
        run: cargo build --locked --workspace

      - name: 测试
        run: cargo test --locked --workspace

      - name: 格式与静态检查（T003）
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: 计数一致性（FR/任务/Check）
        run: python ci/check_counts.py

      - name: 产出依赖记录（V-001，含测量纪律字段）
        run: python ci/platform-matrix/record_deps.py artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: deps-windows
          path: artifacts/deps-windows.txt

      # M0 状态：数据库冒烟（T022/V-002）与写者原型（T026/V-005）已由
      # `cargo test --workspace` 覆盖（whcode-store 内联测试）；
      # TUI 交互式冒烟（V-003）需真实 TTY，CI 无法取证，见 m0-report.md B-05；
      # 基线性能报告（T027）命令：python ci/benchmarks/run-baseline.py
