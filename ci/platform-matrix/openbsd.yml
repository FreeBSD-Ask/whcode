# OpenBSD——已移出原生安装目标（ADR-011，2026-10-21 用户决策）
#
# 结论（M0）：**不适用**。OpenBSD 不再作为 WHCode 的原生构建/安装目标；对 OpenBSD 节点的
# 控制改为通过 WHCode **内置 SSH 客户端**（FR-611）执行受限命令并按 ADR-007 登记。
#
# 本文件不产出任何 OpenBSD 原生产物（不构建、不安装 DuckDB、不占端口）。
# 验收判据（修订后，归属 M7）：
#   - 客户端连通性：内置 SSH 客户端在 OpenBSD 节点完成公钥认证、受限命令执行、输出取回、
#     超时与输出上限、意图—执行—登记；
#   - 不得宣称：原生 WHCode 可执行文件、本机 DuckDB、SSH 服务端。
#
# M0 状态：客户端原型已在 Windows 完成回环端到端测试（whcode-ssh/src/proto.rs）；
# OpenBSD 节点证据**未取得**（阻塞项 B-01 同源，见 artifacts/m0-report.md）。
name: platform-openbsd-client

on:
  # 延后（ADR-013）：Windows 11 amd64 为唯一验收目标；本 workflow 仅供手工触发。
  workflow_dispatch:

jobs:
  client-connectivity-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 占位——客户端连通性验收（M7 前）
        run: |
          echo "OpenBSD 已按 ADR-011 移出原生安装目标。"
          echo "本 job 为客户端连通性验收占位：需要受控 OpenBSD 节点与 WHCode 内置 SSH 客户端。"
          echo "M0 无证据；在取得节点与 M7 能力前，本 job 不产生任何通过结论。"
          exit 0
