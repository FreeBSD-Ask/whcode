# 融洽性公理表：Γ 的可判定片段（ADR-085／docs/guides/coherence-audit.md）
#
# 每条公理把 Γ 中的一条规则登记为可求值的条目。字段含义：
#   id          稳定编号，报告与反例台账引用它
#   axiom       归入的公理或推理规则（A1—A9、R1—R8、M 元公理、H 编码卫生）
#   statement   一句话、可判定，不写“良好”“基本”
#   source      锚点，格式“文件 :: 片段”，片段必须逐字出现在文件里
#   tier        I 可判定／III 半可判定／IV 不可判定
#   phase       参与的阶段：pre／mid／end
#   severity    hard：pre 阶段反例即阻断；soft：只记录
#   evaluator   direct:<谓词>／delegate:<脚本>／registered:<理由>
#   args        delegate 的附加参数（可选）
#
# 约束（由 COH-M1-01 判定）：tier I 不得只写 registered；tier IV 只能是 registered。

schema = 1
updated = "2026-11-17"

