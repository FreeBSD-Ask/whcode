# نص مساعدة CUI (FR-615، T276): المفاتيح هي جذر `cli` + مسار الأمر الفرعي + اسم الخيار الطويل.
# تبقى تعليقات التوثيق المشتقة في المصدر نصًا احتياطيًا عند غياب المفتاح.
