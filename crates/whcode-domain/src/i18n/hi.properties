# CUI का सहायता पाठ (FR-615, T276): key बनावट `cli` मूल + उप-कमांड पथ + विकल्प का लंबा नाम।
# derive वाले doc टिप्पणी स्रोत में रहते हैं और key न मिलने पर वही इस्तेमाल होते हैं।
cli.about = WHCode — लोकल कोडिंग हार्नेस
cli.json = JSON आउटपुट (schema_version एन्वलप, FR-602); किसी भी उप-कमांड से पहले या बाद स्वीकार्य।
cli.workspace = workspace डायरेक्टरी (कॉन्फ़िगर किया गया workspace, वरना cwd; इससे `<workspace>/whcode.duckdb` ढूँढा जाता है)।
cli.lang = इंटरफ़ेस टेक्स्ट की भाषा (जैसे zh-CN, en; LANG/LC_ALL को ओवरराइड करता है, FR-615)।
