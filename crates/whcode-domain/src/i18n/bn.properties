cli.db.check.about = প্রয়োজনীয় ইনডেক্স পরীক্ষা করে।
cli.db.purge.about = সময় ধরে পার্জ (FR-508/509; ডিফল্ট dry-run)।
cli.db.purge.before = সীমা সময় (Unix মিলিসেকেন্ড)।
cli.db.purge.dry-run = কেবল প্রিভিউ (ডিফল্ট)।
cli.db.purge.yes = চালানো নিশ্চিত করে।
cli.db.checkpoint.about = স্পষ্ট checkpoint (FR-510; চাইলে WAL নীতির ওভাররাইডও প্রয়োগ করে, disaster-recovery §5)।
cli.db.checkpoint.threshold = WAL স্বয়ংক্রিয় checkpoint-এর থ্রেশহোল্ড ওভাররাইড করে (যেমন 16MB; না দিলে অপরিবর্তিত)।
cli.db.checkpoint.autocheckpoint = wal_autocheckpoint ওভাররাইড করে (যেমন 1MB; না দিলে অপরিবর্তিত)।
cli.db.restore.about = এক্সপোর্ট থেকে খালি workspace-এ পুনরুদ্ধার করে (`db archive`-এর বিপরীত; স্পষ্ট নিশ্চিতকরণ, কোনো প্রিভিউ নেই)।
cli.db.restore.from = এক্সপোর্ট ফাইলের পাথ (whcode-export ফরম্যাট)।
cli.db.restore.yes = চালানো নিশ্চিত করে (পুনরুদ্ধার লেখে; লক্ষ্য database খালি থাকতে হবে)।
cli.db.compact.about = ডিস্কে database কমপ্যাক্ট করে (কপি—যাচাই—বদল, FR-510; ডিফল্ট dry-run)।
cli.db.compact.dry-run = কেবল প্রিভিউ (ডিফল্ট)।
cli.db.compact.yes = চালানো নিশ্চিত করে।
cli.db.archive.about = workspace এক্সপোর্ট করে।
cli.db.archive.export = আউটপুট পাথ।
cli.db.explain.about = কোয়েরি প্ল্যান বিশ্লেষণ (কেবল-পাঠ কোয়েরি, contract §2-2)।
cli.db.explain.query = কেবল-পাঠ SQL (SELECT/WITH দিয়ে শুরু)।
cli.runtime.about = runtime ব্যবস্থাপনা (FR-701—710; M8)।
cli.runtime.list.about = runtime-এর তালিকা দেখায়।
cli.runtime.status.about = runtime-এর অবস্থা।
cli.runtime.status.name = runtime-এর নাম।
cli.runtime.enable.about = একটি runtime সক্রিয় করে।
cli.runtime.enable.name = runtime-এর নাম।
cli.runtime.disable.about = একটি runtime নিষ্ক্রিয় করে।
cli.runtime.disable.name = runtime-এর নাম।
cli.runtime.install.about = একটি payload ইনস্টল করে।
cli.runtime.install.name = runtime-এর নাম।
cli.font.about = বিল্ট-ইন ফন্ট ইনস্টল ও টার্মিনাল ঘোষণা পরীক্ষা (FR-717; লোকাল রিসোর্স কমান্ড, database স্পর্শ করে না, workspace লাগে না)।
cli.font.install.about = চারটি বিল্ট-ইন ফন্ট ব্যবহারকারীর ফন্ট ডিরেক্টরিতে ইনস্টল করে ও HKCU নিবন্ধন লেখে (কপি-ওভার অর্থে, পুনরায় চালানো নিরাপদ)।
cli.font.install.from = ফন্টের উৎস ডিরেক্টরি (সমতল বিন্যাস বা রিপোজিটরির `source/<family>/` বিন্যাস); না দিলে আগে এক্সিকিউটেবলের পাশে, তারপর বর্তমান ডিরেক্টরির `assets/fonts/source` খোঁজা হয় (ADR-028 সংশোধন 1)।
cli.font.install.dry-run = সিস্টেম না বদলে কোন কোন কাজ চলত তা-ই জানায়।
cli.font.status.about = ফন্ট ইনস্টলের অবস্থা ও টার্মিনাল ঘোষণা জানায় (কেবল-পাঠ)।
cli.font.uninstall.about = বিল্ট-ইন ফন্ট আনইনস্টল করে: নিবন্ধন তুলে নেয় ও ব্যবহারকারীর ফন্ট ডিরেক্টরি থেকে ফাইল মুছে (যথাসাধ্য চেষ্টা, একটি একটি করে জানায়)।
cli.font.uninstall.dry-run = সিস্টেম না বদলে কোন কোন কাজ চলত তা-ই জানায়।
cli.serve.about = ট্রান্সপোর্ট এন্ট্রি পয়েন্ট (M6/M7)।
cli.serve.web = Web এন্ট্রি পয়েন্ট (M6)।
cli.serve.ssh = SSH এন্ট্রি পয়েন্ট (M7, স্থগিত)।
cli.serve.bind = বাইন্ড অ্যাড্রেস (ডিফল্টে কেবল লুপব্যাক, FR-606)।
cli.doctor.about = পরিবেশ ও কনফিগারেশনের সেলফ-চেক (M0)।
cli.doctor.json = JSON আউটপুট।
cli.hint.no_console = whcode {version} — কোনো ইন্টারঅ্যাকটিভ কনসোল পাওয়া যায়নি, ইন্টারফেস চালু হয়নি
cli.hint.options = পাওয়া যায়: --tui (টার্মিনাল UI), --cli <subcommand>, --lang <ভাষা>, --help
