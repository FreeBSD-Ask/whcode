# CUI 도움말 텍스트(FR-615, T276): 키 규칙은 `cli` 루트 + 하위 명령 경로 + 긴 옵션 이름입니다.
# derive 쪽 doc 주석은 원문으로 남겨 두어, 카탈로그에 키가 없을 때 대체 문구로 쓰입니다.
