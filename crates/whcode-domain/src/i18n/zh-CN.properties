# TUI 固定界面文本（批次 3：Task T130 接线）
view.sessions = 会话
view.tasks = 任务
view.context = 上下文
view.events = 事件
view.spec = Spec 状态
view.diff = diff 预览
tui.title = whcode —— {view}（{index}/{count}）
tui.footer = 窗口 {cols}×{rows} · 按键 {keys} · 1—6 视图 · j/k 会话 · r 刷新 · q 退出
