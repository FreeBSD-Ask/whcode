# CUI 人类可读输出（数据字段名保持稳定，不随语言变化）
cui.status_line = {session} {title} [{stage}] 状态={status} 游标={cursor}
cui.created = 已创建会话 {session}
cui.renamed = 已重命名会话 {session}
cui.archived = 已归档会话 {session}
cui.unarchived = 已取消归档会话 {session}
cui.delete_dry_run = dry-run：将删除会话 {session}（事件 {events} 行，任务 {tasks} 行；受保护跳过 {skipped} 个）——加 --yes 执行
cui.deleted = 已删除会话 {session}
cui.task_retried = {task} 已重试（retry={retry}）→ {status}
cui.task_aborted = {task} 已中止 → {status}
cui.tasks_summary = 会话 {session}：总计 {total} · 完成 {done} · 阻塞 {blocked} · 活跃 {active}
cui.spec_status = 会话 {session}：阶段 {stage} · 事件游标 {cursor}
cui.purge_dry_run = dry-run：{sessions} 个会话、{events} 条事件将被清理（受保护跳过 {skipped} 个）——加 --yes 执行
cui.purged = 已清理 {events} 条事件
cui.compact_dry_run = dry-run：文件 {file} B、WAL {wal} B——加 --yes 执行 compact（不承诺缩小文件）
cui.compact_done = compact 完成（切换={switched}）
cui.exported = 已导出到 {path}（hash {hash}）
cui.plan_rows = 计划行 {rows} 条（analyze=false，不执行查询）
cui.indexes_ok = 索引完整

