[package]
name = "whcode-mcp"
description = "WHCode MCP 客户端最小集：stdio transport、JSON-RPC 2.0 协议层与工具投影"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
whcode-domain = { path = "../whcode-domain" }
whcode-platform = { path = "../whcode-platform" }
whcode-runtime = { path = "../whcode-runtime" }
serde.workspace = true
serde_json.workspace = true
# Streamable HTTP 传输（ADR-055 §2.10）：与 whcode-llm 同版本同口径（rustls，无默认特性）。
ureq = { version = "3.5.0", default-features = false, features = ["rustls"] }

[lints]
workspace = true
