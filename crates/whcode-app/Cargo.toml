[package]
name = "whcode-app"
description = "WHCode 应用服务：命令处理、权限检查、用例编排、状态快照"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# ADR-018：app 经 store 公共 API 访问存储；SQL 仍只在 store。
whcode-domain = { path = "../whcode-domain" }
whcode-store = { path = "../whcode-store" }
# 事件导出经 llm 追踪层脱敏（FR-205）；llm 为同层领域服务（ADR-018 同口径）。
whcode-llm = { path = "../whcode-llm" }
# 门禁编排经 speckit 状态机与工作流配置（FR-307/308）；speckit 为同层领域服务。
whcode-speckit = { path = "../whcode-speckit" }
serde.workspace = true
serde_json.workspace = true
# 仅使用 duckdb::Connection 类型（命令签名）；连接的打开与管理在 store/装配根（ADR-018）。
duckdb = { version = "=1.20000.0", default-features = false }

[lints]
workspace = true
