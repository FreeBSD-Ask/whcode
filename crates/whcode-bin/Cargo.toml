[package]
name = "whcode-bin"
description = "WHCode 主程序：配置加载、日志初始化与 feature 装配"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# 对外二进制名固定为 `whcode`（package 名仅为仓库内部命名，§6.2）。
[[bin]]
name = "whcode"
path = "src/main.rs"

[dependencies]
whcode-app = { path = "../whcode-app" }
# CUI 命令树（批次 2 调度装配；契约 contracts/cui-cli.md §1）。
whcode-cui = { path = "../whcode-cui" }
whcode-domain = { path = "../whcode-domain" }
# `gui` 入口装配（FR-711／ADR-027）：原生桌面 GUI，只读六视图。
whcode-gui = { path = "../whcode-gui" }
# 真实 LLM Provider（FR-201／FR-203／FR-616、NFR-213、ADR-031）：装配根启用 `http` feature——
# 域层与前端保持零网络依赖，网络依赖只进二进制装配（发布体积影响见 ADR-031）。
whcode-llm = { path = "../whcode-llm", features = ["http"] }
whcode-platform = { path = "../whcode-platform" }
# 运行时声明与能力等级展示（ADR-024）：装配根只读取声明/探针，不加载动态库。
whcode-runtime = { path = "../whcode-runtime" }
whcode-store = { path = "../whcode-store" }
# `serve --ssh` 装配（T096—T098、ADR-030）：SSH 服务端为独立传输入口，复用应用服务。
whcode-ssh = { path = "../whcode-ssh" }
whcode-tui = { path = "../whcode-tui" }
# `serve --web` 装配（contracts/cui-cli.md §1）：静态前端 + `/api/*` 路由与安全判定。
whcode-web = { path = "../whcode-web" }
# 入站 TLS 握手状态机（T189、ADR-040 决策 3）：与 `whcode-llm`／`ureq` 同版本、共用 ring
# 提供者；不启用默认特性（默认会拉入 aws-lc-rs，形成第二加密提供者），不引入异步 TLS。
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "ring", "logging"] }
# 与 rustls 同源的证书／私钥 PEM 解析类型；不另造封装（ADR-040 决策 5）。
rustls-pki-types = { version = "1.15.1", features = ["std"] }
serde.workspace = true
serde_json.workspace = true
# 基线夹具需要打开临时数据库连接并交给 `whcode_store::EventWriter`（tasks.md T027）。
# 版本与特性同 `whcode-store`：同一份预编译动态库，避免出现两份 libduckdb-sys 实例。
duckdb = { version = "=1.20000.0", default-features = false }

[dev-dependencies]
# 测试用服务端证书生成（ring 后端，与 `whcode-app` 一致；不得拉入 aws-lc-rs）。
# 仅测试需要，生产路径不生成证书（生成属 `whcode-app::cert`，ADR-040 决策 3）。
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }

[features]
default = ["http"]
# 真实 LLM Provider 的装配开关（T167、ADR-031 决策 1）：`--no-default-features` 时
# `llm run` 返回结构化 `not_supported`（不联网、不伪装成功）。注意 `whcode-llm` 的
# `http` feature 仍由依赖声明开启——出站证书探针（ADR-040）复用同一信任装配，
# 本开关只门控 Provider 装配路径，不改变链接层的网络依赖。
http = ["whcode-llm/http"]
# 可选运行时装配开关（FR-704、D-07）。
# 默认全部关闭：未启用运行时不加载动态库、不占端口、不注册可执行工具。
# 目前为空实现——真正的运行时装配在 M8（tasks.md T103）接入 `whcode-runtime`。
runtime-js = []
runtime-python = []
runtime-gitbash = []

[lints]
workspace = true
