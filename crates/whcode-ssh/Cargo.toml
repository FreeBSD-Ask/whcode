[package]
name = "whcode-ssh"
description = "WHCode SSH 入口：认证、会话生命周期与终端流适配"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# SSH 客户端实现（M0 风险原型 T025；完整客户端与服务端属 M7）。版本由外部锁定，不得降级。
russh = "0.64.1"
# 异步运行时：原型需要超时控制与 TCP 连接（`russh::client::connect` 使用 tokio 网络栈）。
tokio = { version = "1", features = ["net", "time"] }
whcode-app = { path = "../whcode-app" }
whcode-domain = { path = "../whcode-domain" }

[dev-dependencies]
# 测试用临时密钥生成（仅测试目标引入，不进入发布路径）。
rand = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
