[package]
name = "whcode-llm"
description = "WHCode LLM Provider 抽象、流式响应、重试与计量"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
whcode-domain = { path = "../whcode-domain" }
serde.workspace = true
serde_json.workspace = true
# 真实 HTTP Provider（FR-209—214、ADR-031）：默认关闭——域层与前端保持零网络依赖，
# 仅装配根（whcode-bin）启用 `http` feature。阻塞式客户端，不引入异步运行时（NFR-215）。
ureq = { version = "3.5.0", default-features = false, features = ["rustls"], optional = true }

[features]
default = []
http = ["dep:ureq"]

[lints]
workspace = true
