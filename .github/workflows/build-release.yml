# 构建与发布（2026-10-25 用户指令）：把原 platform-verification.yml `platform-windows` 里的构建、打包、
# 冒烟与发布链拆为独立矩阵文件，让门禁／测试（platform-verification.yml）与交付（本文件）各自拥有
# 触发语义与权限边界。
#
# 触发（2026-10-31 用户指令，2026-11-01 实施）：push tag v*、workflow_dispatch——
# push main 不再自动构建 release（每次推送都出包太频繁）；交付构建随 tag 发布或按需
# 手动触发。门禁与测试仍由 platform-verification.yml 每次 push main 运行（ADR-037），不受本收敛影响。
#
# 矩阵三档（fail-fast: false，三档互不掩盖失败；ADR-043）：
#   - debug/amd64（windows-latest）：构建 workspace 并产出依赖记录（V-001），只验证依赖图可解；
#   - release/amd64（windows-latest）：发布构建 → 打包并安装验证（T118）→ SHA256 → TUI／Web 冒烟；
#   - release/arm64（windows-11-arm 原生）：同上链路，按 ADR-043 作构建交付目标——
#     打包与安装验证在原生 ARM64 runner 上取得真实运行证据，结论不进验收（验收仍为
#     Windows 11 amd64，ADR-013）。
#
# 第四条 lane（ADR-083，2026-11-17 用户批准）：package-freebsd（ubuntu-latest 宿主＋
# vmactions/freebsd-vm）——FreeBSD 在「完整平台证据通道（硬门禁）」之上扩展为构建交付
# 目标：rustup 1.100.0＋DuckDB 2.0.0 源码构建（bsd-duckdb.sh）→ release 构建（RPATH=$ORIGIN）
# → package-freebsd.sh 打包 tar.gz＋安装验证（仓库外解包三条命令）＋TUI/Web 冒烟；
# 结论不作验收，证据身份为 vmactions QEMU（与平台通道同源）。
#
# 三条 Windows lane 的目标三元组均为 gnullvm：amd64 用 `x86_64-pc-windows-gnullvm`（ADR-073，
# 2026-11-14），arm64 用 `aarch64-pc-windows-gnullvm`（ADR-074，2026-11-15，交叉构建）。
# 三条 Windows lane 都先用 `setup-windows-llvm.py` 装 llvm-mingw（固定版本＋SHA256）；amd64 装的是
# x86_64 gnullvm 宿主工具链，arm64 装 msvc 宿主＋gnullvm 目标 std（rustup 无 aarch64 gnullvm
# 宿主工具链），C 编译器取 llvm-mingw 包内的 aarch64-w64-mingw32-clang。FreeBSD lane 用
# rustup 原生 1.100.0（pkg 的 rust 版本不确定，无法满足可复现要求）。
#
# 权限：顶层只读；仅 tag 发布 job 提升为 contents: write，且只用 GITHUB_TOKEN，
# 不引入其他凭据（最小权限，AGENTS.md §1.1）。
#
# 纪律：测试“通过”结论仍归 platform-verification.yml（ADR-037）；本文件只承载交付链。
# tag 与包版本的一致性、SHA256 独立复算与安装验证记录交叉校验均由 check-release.py 判定
# （按 --arch 逐架构调用），失败即中止，不以 0 或空值冒充。
name: build-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Windows runner 控制台默认代码页非 UTF-8；脚本含中文输出，统一强制 Python UTF-8 模式。
env:
  PYTHONUTF8: "1"

permissions:
  contents: read

jobs:
  package:
    name: package-${{ matrix.arch }}-${{ matrix.profile }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: debug
            arch: amd64
            target: x86_64-pc-windows-gnullvm
            os: windows-latest
          - profile: release
            arch: amd64
            target: x86_64-pc-windows-gnullvm
            os: windows-latest
          - profile: release
            arch: arm64
            target: aarch64-pc-windows-gnullvm
            os: windows-11-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ADR-073：amd64 发布链走 gnullvm（llvm-mingw ＋ rustup gnullvm 主机工具链）。
      - name: 安装 LLVM 系列 Windows 工具链（llvm-mingw ＋ rustup gnullvm，ADR-073）
        if: matrix.arch == 'amd64'
        run: python .github/scripts/setup-windows-llvm.py

      # ADR-074：ARM64 交付链同样走 gnullvm，但为交叉——主机是 aarch64-pc-windows-msvc
      # （rustup 无 aarch64 gnullvm 宿主工具链），目标 aarch64-pc-windows-gnullvm；
      # llvm-mingw 的 aarch64-w64-mingw32-clang 在 ARM64 runner 上以 x64 模拟运行，
      # 产物为原生 ARM64，安装验证（--verify）仍在同一 runner 上真跑。
      - name: 安装 LLVM 系列 Windows 工具链（ARM64：msvc 主机＋gnullvm 目标，ADR-074）
        if: matrix.arch == 'arm64'
        run: |
          python .github/scripts/setup-windows-llvm.py `
            --rustup-toolchain 1.100.0-aarch64-pc-windows-msvc `
            --rustup-target aarch64-pc-windows-gnullvm

      # 确定性构建基准（ADR-047）：用 HEAD 提交时间导出 SOURCE_DATE_EPOCH（打包基准）
      # 与 WHCODE_BUILD_STAMP（版本戳，UTC `Z` 形式），使同一提交的全新构建与打包
      # 字节一致；本地构建未注入时保持墙钟行为。两变量随 GITHUB_ENV 作用于后续步骤。
      - name: 确定性构建基准（ADR-047）：提交时间 → WHCODE_BUILD_STAMP／SOURCE_DATE_EPOCH
        shell: bash
        run: |
          set -euo pipefail
          epoch=$(git log -1 --format=%ct)
          {
            echo "SOURCE_DATE_EPOCH=${epoch}"
            echo "WHCODE_BUILD_STAMP=$(date -u -d "@${epoch}" +%Y-%m-%dT%H:%MZ)"
          } >> "$GITHUB_ENV"

      # 按宿主三元组自动选择：amd64 runner 拉 amd64 载荷，windows-11-arm runner 拉 arm64 载荷
      # （fetch-duckdb.py 的 host_target 推断，ADR-043）。
      - name: 拉取并校验预编译 DuckDB（ADR-DB-BUILD）
        run: python .github/scripts/fetch-duckdb.py

      # ---------------- debug/amd64：依赖图可解 + 依赖记录 ----------------
      - name: 构建（锁定依赖图）
        if: matrix.profile == 'debug'
        run: cargo build --locked --workspace

      - name: 产出依赖记录（V-001，含测量纪律字段）
        if: matrix.profile == 'debug'
        run: python .github/scripts/platform-matrix/record_deps.py artifacts

      - name: 上传 Windows 依赖记录
        if: matrix.profile == 'debug'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deps-windows
          path: artifacts/deps-windows.txt

      # ---------------- release：发布构建 → 打包 → 校验 → 冒烟 ----------------
      - name: 发布构建（amd64，宿主构建）
        if: matrix.profile == 'release' && matrix.arch == 'amd64'
        run: cargo build --release --locked -p whcode-bin

      # ARM64 的发布构建是**交叉**（ADR-074）：主机 aarch64-pc-windows-msvc，目标
      # aarch64-pc-windows-gnullvm，产物落 `target/aarch64-pc-windows-gnullvm/release/`，
      # 与 package-windows.py 的 binary_path（target≠host 时取 target/<三元组>/release/）一致。
      # 链接用 arm64 载荷：必须导出**绝对** DUCKDB_LIB_DIR（ADR-069 修订：相对值会绕过 cargo
      # [env] 的 relative=true 绝对化，测试/运行期按错误 cwd 解析）。
      - name: 发布构建（arm64，gnullvm 交叉，ADR-074）
        if: matrix.profile == 'release' && matrix.arch == 'arm64'
        env:
          DUCKDB_LIB_DIR: ${{ github.workspace }}/vendor/duckdb/2.0.0/aarch64-pc-windows-msvc
        run: cargo build --release --locked -p whcode-bin --target aarch64-pc-windows-gnullvm

      # 解包到仓库外临时目录运行，避免仓库内 vendor/duckdb 与 target/ 污染 DLL 搜索路径。
      # --verify 仅在宿主架构与目标一致时由脚本放行：amd64 lane 宿主构建可验；
      # arm64 lane 在原生 ARM64 runner 上验，真实运行证据（ADR-043）。
      - name: 打包并安装验证（T118）
        if: matrix.profile == 'release'
        run: python .github/scripts/package-windows.py --target ${{ matrix.target }} --verify --record artifacts/install-verify-windows-${{ matrix.arch }}.txt

      - name: 生成发布包 SHA256（sha256sum 兼容格式）
        if: matrix.profile == 'release'
        run: python .github/scripts/check-release.py --dir target/dist --write

      - name: TUI 可自动化冒烟（V-003：--version／doctor／非交互退出；amd64）
        if: matrix.profile == 'release' && matrix.arch == 'amd64'
        run: python .github/scripts/tui-smoke.py --json artifacts/tui-smoke-ci.json

      # ADR-074：arm64 lane 是交叉构建，产物落 `target/<三元组>/release/`（不再是
      # `target/release/`）；冒烟脚本必须显式指该路径，否则 run 43627842215 那样在
      # “找不到 exe”处红——而构建、打包与安装验证此前已经通过。
      - name: TUI 可自动化冒烟（V-003；arm64 原生，ADR-043 平台证据）
        if: matrix.profile == 'release' && matrix.arch == 'arm64'
        run: python .github/scripts/tui-smoke.py --exe target/aarch64-pc-windows-gnullvm/release/whcode.exe --json artifacts/tui-smoke-ci-arm64.json

      - name: Web 服务端冒烟（/api/status、/api/sessions、首页；amd64）
        if: matrix.profile == 'release' && matrix.arch == 'amd64'
        run: python .github/scripts/web-smoke.py --json artifacts/web-smoke-ci.json

      - name: Web 服务端冒烟（arm64 原生，ADR-043 平台证据）
        if: matrix.profile == 'release' && matrix.arch == 'arm64'
        run: python .github/scripts/web-smoke.py --exe target/aarch64-pc-windows-gnullvm/release/whcode.exe --json artifacts/web-smoke-ci-arm64.json

      - name: 上传发布包（zip + sha256）
        if: matrix.profile == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whcode-windows-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            target/dist/*.zip
            target/dist/*.sha256

      - name: 上传安装验证记录
        if: matrix.profile == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-verify-windows-${{ matrix.arch }}
          path: artifacts/install-verify-windows-${{ matrix.arch }}.txt

      # 冒烟失败时 JSON 可能缺失或为半成品；always() 上传，缺文件按警告而非静默通过。
      - name: 上传冒烟证据（TUI／Web）
        if: always() && matrix.profile == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-evidence-windows-${{ matrix.arch }}
          if-no-files-found: warn
          path: |
            artifacts/tui-smoke-ci*.json
            artifacts/web-smoke-ci*.json

  # ---------------- FreeBSD 发布包（ADR-083；tag v* 与 workflow_dispatch） ----------------
  package-freebsd:
    name: package-freebsd-amd64-release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 确定性构建基准（ADR-047）：与 Windows lane 同口径，HEAD 提交时间。
      - name: 确定性构建基准（ADR-047）：提交时间 → WHCODE_BUILD_STAMP／SOURCE_DATE_EPOCH
        run: |
          set -euo pipefail
          epoch=$(git log -1 --format=%ct)
          {
            echo "SOURCE_DATE_EPOCH=${epoch}"
            echo "WHCODE_BUILD_STAMP=$(date -u -d "@${epoch}" +%Y-%m-%dT%H:%MZ)"
          } >> "$GITHUB_ENV"

      - name: 在 FreeBSD VM 中构建、打包、安装验证与冒烟（ADR-083）
        id: freebsd_pkg
        # 与 platform-verification.yml 平台通道同一份 pin（action 版本铁律，§5.1）。
        uses: vmactions/freebsd-vm@811efaaac0668df8bfb8308c3ec997b5ab50037b # v1.6.0
        with:
          # 只写主版本：action 自动取最新 15.x 点版本。
          release: "15"
          usesh: true
          prepare: |
            # latest pkg 仓库与 X11／字体依赖面与平台通道同源（platform-verification.yml
            # FreeBSD job 的 prepare，2026-10-31 用户指令允许 ports／latest pkg）。
            mkdir -p /usr/local/etc/pkg/repos
            printf 'FreeBSD: {\n  url: "https://pkg.freebsd.org/${ABI}/latest",\n  signature_type: "fingerprints",\n  fingerprints: "/usr/share/keys/pkg"\n}\n' \
              > /usr/local/etc/pkg/repos/whcode-latest.conf
            pkg update -q
            # whcode-bin 装配 whcode-gui，编译期同样需要 X11/xkb/字体栈头文件。
            pkg install -y curl cmake ninja python3 pkgconf \
              libX11 libXcursor libXrandr libXi libxkbcommon \
              fontconfig freetype2 wayland
          run: |
            # 证据保全（与平台通道同款）：VM 脚本非零退出会跳过 copyback，主体改为
            # 子 shell——失败只写标记文件并 exit 0，由宿主步骤判红；门禁语义不变。
            set +e
            (
            set -e
            mkdir -p artifacts/release-freebsd artifacts/store-acceptance
            # rustup 装锁定工具链（pkg 的 rust 版本不确定，无法满足可复现要求）。
            export HOME=/root
            export PATH="$HOME/.cargo/bin:$PATH"
            if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain 1.100.0
            fi
            rustc -vV
            cargo -V
            # DuckDB 2.0.0 源码构建（官方无 BSD 预编译包）：产出 libduckdb.so 与 env；
            # env 文件同时是版本与就绪标记（WHCODE_DUCKDB_READY）。
            sh .github/scripts/platform-matrix/bsd-duckdb.sh artifacts/release-freebsd/duckdb
            # shellcheck disable=SC1091
            . artifacts/release-freebsd/duckdb/freebsd-duckdb.env
            # 发布构建：RPATH=$ORIGIN 让包内 libduckdb.so 与可执行文件同目录即可运行；
            # CARGO_TARGET_DIR 放 VM 本地，避免数百 MB target 被 copyback 拖慢 lane。
            export CARGO_TARGET_DIR=/tmp/whcode-rel-target
            export RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN'
            cargo build --release --locked -p whcode-bin
            sh .github/scripts/package-freebsd.sh
            echo "FREEBSD_PKG_BODY=GO"
            )
            body_rc=$?
            set -e
            if [ "$body_rc" -ne 0 ]; then
              mkdir -p artifacts
              [ -f artifacts/freebsd-release-failed.txt ] || \
                echo "freebsd_release_failed_rc=$body_rc" > artifacts/freebsd-release-failed.txt
              echo "FREEBSD_RELEASE_FAILED=$body_rc（证据已保全，由宿主步骤判红）"
            fi

      # 宿主步骤判红：VM 主体失败时红，且不得以缺文件冒充通过。
      - name: FreeBSD 发布门禁判定
        if: always()
        run: |
          if [ -f artifacts/freebsd-release-failed.txt ]; then
            echo "FreeBSD 发布 lane：**失败**（$(cat artifacts/freebsd-release-failed.txt)）" >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/freebsd-release-failed.txt
            exit 1
          fi
          echo "FreeBSD 发布 lane：VM 主体完成，门禁判定通过。" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 FreeBSD 发布包（tar.gz + sha256）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: whcode-freebsd-amd64
          if-no-files-found: error
          path: |
            artifacts/release-freebsd/*.tar.gz
            artifacts/release-freebsd/*.tar.gz.sha256

      - name: 上传 FreeBSD 安装验证记录
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-verify-freebsd-amd64
          if-no-files-found: warn
          path: artifacts/release-freebsd/install-verify-freebsd-amd64.txt

      - name: 上传 FreeBSD 冒烟证据（TUI／Web）
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-evidence-freebsd-release
          if-no-files-found: warn
          path: |
            artifacts/tui-smoke-freebsd-release.json
            artifacts/web-smoke-freebsd-release.json

  # ---------------- GitHub Release（仅 tag v*） ----------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, package-freebsd]
    runs-on: windows-latest
    timeout-minutes: 20
    # 仅本 job 需要写权限；顶层仍为 contents: read。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: 下载 amd64 发布包 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: whcode-windows-amd64
          path: dist

      - name: 下载 arm64 发布包 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: whcode-windows-arm64
          path: dist

      - name: 下载 FreeBSD 发布包 artifact（ADR-083）
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: whcode-freebsd-amd64
          path: dist

      # 安装验证记录是 SHA256 的第二来源：check-release.py 复算后与之交叉校验（按平台）。
      - name: 下载 amd64 安装验证记录 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-verify-windows-amd64
          path: verify-amd64

      - name: 下载 arm64 安装验证记录 artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-verify-windows-arm64
          path: verify-arm64

      - name: 下载 FreeBSD 安装验证记录 artifact（ADR-083）
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: install-verify-freebsd-amd64
          path: verify-freebsd

      # tag 取 runner 注入的环境变量，不把表达式拼进 shell 命令串。
      - name: 校验 tag 与包版本、重算 SHA256，并与安装验证记录交叉校验（amd64）
        run: python .github/scripts/check-release.py --dir dist --tag "$env:GITHUB_REF_NAME" --arch amd64 --record verify-amd64/install-verify-windows-amd64.txt

      - name: 校验 tag 与包版本、重算 SHA256，并与安装验证记录交叉校验（arm64，ADR-043）
        run: python .github/scripts/check-release.py --dir dist --tag "$env:GITHUB_REF_NAME" --arch arm64 --record verify-arm64/install-verify-windows-arm64.txt

      - name: 校验 tag 与包版本、重算 SHA256，并与安装验证记录交叉校验（freebsd-amd64，ADR-083）
        run: python .github/scripts/check-release.py --dir dist --tag "$env:GITHUB_REF_NAME" --arch freebsd-amd64 --record verify-freebsd/install-verify-freebsd-amd64.txt

      # windows-latest 自带 Git Bash 与 gh；只做上传与发布，不再构建。
      # tag 含 `-`（如 v0.1.0-rc.1）按预发布发布；标签已存在则 --clobber 覆盖同名资产。
      # 发布物为两平台 zip（各含 .zip 与 .zip.sha256，ADR-043）＋FreeBSD tar.gz
      # （含 .tar.gz.sha256，ADR-083），共六件资产。
      - name: 创建或更新 GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # 用 bash 内建通配定位资产，不引入外部工具；两 Windows 架构各一包一校验和，
          # FreeBSD 一包一校验和（ADR-083）。
          shopt -s nullglob
          zips=(dist/*.zip)
          shas=(dist/*.zip.sha256)
          tars=(dist/*.tar.gz)
          tarshas=(dist/*.tar.gz.sha256)
          if [ "${#zips[@]}" -ne 2 ] || [ "${#shas[@]}" -ne 2 ] || [ "${#tars[@]}" -ne 1 ] || [ "${#tarshas[@]}" -ne 1 ]; then
            echo "发布失败：dist 下应有且仅有 amd64/arm64 两个 .zip 与两个 .zip.sha256、" \
                 "freebsd-amd64 一个 .tar.gz 与一个 .tar.gz.sha256（ADR-083），" \
                 "实际 zip=${#zips[@]} sha256=${#shas[@]} tar=${#tars[@]} tar.sha256=${#tarshas[@]}" >&2
            exit 1
          fi

          prerelease=()
          case "$TAG" in
            *-*) prerelease=(--prerelease) ;;
          esac

          assets=("${zips[@]}" "${shas[@]}" "${tars[@]}" "${tarshas[@]}")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" "${assets[@]}" --title "$TAG" --generate-notes "${prerelease[@]}"
          fi
