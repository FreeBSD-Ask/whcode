# NetBSD 平台构建、测试与依赖记录（tasks.md T005/T020；V-001、V-002）
#
# 运行策略（2026-10-24 用户指令，见 ADR-013 修订记录）：
#   - 随 main 分支 push 自动运行；workflow_dispatch 保留。
#   - 结果只作**平台证据**，不进入验收结论；唯一验收目标仍是 Windows 11 amd64。
#
# 工具链差异：rustup 不提供 NetBSD host 构建，只能用 pkgsrc 的 rust；其版本由 pkgsrc
# 树决定。低于 MSRV 1.88 时脚本显式 SKIP（环境限制，不作代码结论）；满足时正常跑测试。
#
# 绿路径（必过）：`cargo check` 全工作区 + 不依赖 libduckdb 的包级测试。
# DuckDB 原生构建与全量测试属 Go/No-Go 门禁：失败是显式证据（NO-GO），不使 job 变红。
#
# 环境变量契约（ADR-DB-BUILD）：外部 shell 环境变量优先于 .cargo/config.toml 的 [env] 表。
name: platform-netbsd

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-test-deps-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 在 NetBSD VM 中构建、测试与记录
        id: vm
        uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1.5.2
        with:
          usesh: true
          prepare: |
            pkgin -y install rust cmake ninja
            pkgin -y install duckdb || true
          run: |
            set -e
            rustc -vV
            cargo -V

            version=$(rustc --version | awk '{print $2}')
            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            if [ "$major" -lt 1 ] || { [ "$major" -eq 1 ] && [ "$minor" -lt 88 ]; }; then
              echo "SKIP：pkgsrc rust $version 低于 MSRV 1.88（环境限制，不作代码结论）"
              exit 0
            fi

            echo "=== 代码级检查（cargo check，不链接 DuckDB）==="
            cargo check --locked --workspace

            echo "=== 包级测试（不依赖 libduckdb 的 crate）==="
            cargo test --locked -p whcode-domain -p whcode-platform -p whcode-speckit \
              -p whcode-llm -p whcode-runtime

            echo "=== 依赖记录（V-001）==="
            sh ci/platform-matrix/record-deps.sh artifacts

            echo "=== DuckDB 原生 Go/No-Go（失败属 R-01 证据，不使 job 变红）==="
            if pkg_info duckdb >/dev/null 2>&1; then
              export DUCKDB_LIB_DIR=/usr/pkg/lib
              export DUCKDB_INCLUDE_DIR=/usr/pkg/include
              if cargo build --locked --workspace && cargo test --locked --workspace; then
                echo "GATE_RESULT=GO"
              else
                echo "GATE_RESULT=NO-GO（版本或 ABI 不匹配，属 R-01 预期风险路径）"
              fi
            else
              echo "GATE_RESULT=NO-GO（pkgsrc 无 DuckDB 包：需 bundled-cmake 源码构建，待评估）"
            fi

      - name: 归档结论
        if: always()
        run: |
          echo "NetBSD 绿路径：${{ steps.vm.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "若绿路径失败且原因是 pkgsrc rust 低于 MSRV，属环境限制（见文件头注释）。" >> "$GITHUB_STEP_SUMMARY"
          echo "DuckDB Go/No-Go 见 VM 日志末尾；两者均只作平台证据，不进入验收结论。" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deps-netbsd
          path: artifacts/deps-netbsd.txt

      # TODO：数据库冒烟（V-002）须在门禁 GO 后于本平台真实运行并归档日志。
