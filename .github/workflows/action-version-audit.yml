# CI action 版本审计（铁律：最新版本 + 固定 SHA；2026-10-24 用户指令）。
#
# 本工作流只做联网复核：查询每个 action 的最新 release／tag 及其 commit SHA，与
# `.github/scripts/action-versions.json` 比对。上游更新而清单未更新时失败，提醒维护者升级；
# 每次 push 的离线门禁在 `platform-matrix.yml` 的 windows 条目中执行（`python .github/scripts/check-actions.py`）。
#
# 维护流程：运行 `python .github/scripts/check-actions.py --update` 刷新清单 → 同步更新工作流中的
# `uses: ...@<sha> # <版本>` → 运行离线门禁 → 提交。例外必须走 ADR。
name: action-version-audit

on:
  schedule:
    # 每周一 03:17 UTC（北京时间 11:17），避开整点高峰。
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 联网复核 action 是否为最新版本
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check-actions.py --online
