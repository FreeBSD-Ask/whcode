# CI 统一入口（2026-10-25 用户指令）：原 platform-matrix / stability / action-version-audit
# 三份工作流合并为本文件；5.5 小时长跑因 GitHub 单 job 6 小时上限单独保留在 long-run.yml。
#
# 触发与门控：
#   - push main / pull_request / workflow_dispatch：跑门禁、构建与全部测试、测量；
#     平台矩阵中 Windows 在范围内原生运行，四个 BSD 仅作平台证据（ADR-013）。
#   - schedule（每周一 03:17 UTC）：只跑 action 版本联网审计，不跑测试（job 级 if 门控）。
#   - workflow_dispatch 的 `desktop` 输入：额外跑 GUI 探针；托管 runner 无交互桌面，
#     结果按 headless/虚拟显示口径记录，不替代真实桌面人工证据。
#
# 纪律：
#   - 所有 job 只读仓库；上传 artifact 使用 Actions 运行时令牌。
#   - 测试与测量的唯一验收入口是 CI；本地脚本仅作复现与排障（用户 2026-10-25 选择）。
#   - 测量 job 串行执行（写者压力/内存/查询计划/NFR 对资源敏感），避免互相污染。
name: ci

on:
  workflow_dispatch:
    inputs:
      desktop:
        description: "运行桌面型测试（GUI 探针；托管 runner 无交互桌面时为 headless 口径）"
        type: boolean
        default: false
      perf:
        description: "运行性能预算（NFR-207/209 与测试进程 RSS；托管 runner 结果仅作受控测量信号）"
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
  schedule:
    # 每周一 03:17 UTC（北京时间 11:17），只触发 action 版本审计 job。
    - cron: "17 3 * * 1"

# Windows runner 控制台默认代码页非 UTF-8；门禁脚本含中文输出，统一强制 Python UTF-8 模式。
env:
  PYTHONUTF8: "1"

permissions:
  contents: read

jobs:
  platform:
    if: github.event_name != 'schedule'
    name: platform-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # 触发语义放在步骤级：GitHub 的 jobs.<job_id>.if 不支持 matrix 上下文。
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            os: windows-latest
          - platform: freebsd
            os: ubuntu-latest
          - platform: netbsd
            os: ubuntu-latest
          - platform: openbsd
            os: ubuntu-latest
          - platform: dragonfly
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ---------------- Windows ----------------
      - name: 工作流语义门禁（job 级 if 禁用 matrix 等 GitHub 限制）
        if: matrix.platform == 'windows'
        run: python .github/scripts/check-workflows.py

      - name: CI action 版本门禁（最新版本 + 固定 SHA）
        if: matrix.platform == 'windows'
        run: python .github/scripts/check-actions.py

      - name: 显示锁定工具链（rust-toolchain.toml）
        if: matrix.platform == 'windows'
        run: rustup show

      - name: 拉取并校验预编译 DuckDB（ADR-DB-BUILD）
        if: matrix.platform == 'windows'
        run: python .github/scripts/fetch-duckdb.py

      - name: 格式与静态检查（T003）
        if: matrix.platform == 'windows'
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: EOL 与编码门禁（LF / 无 BOM）
        if: matrix.platform == 'windows'
        run: python .github/scripts/check-eol.py

      - name: 测试（含分层与目录分类契约）
        if: matrix.platform == 'windows'
        run: cargo test --locked --workspace

      - name: 内置 SSH 回环验收（Check 25，Windows 客户端侧）
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ssh-acceptance | Out-Null
          cargo test --locked -p whcode-ssh -- --nocapture 2>&1 |
            Tee-Object -FilePath artifacts/ssh-acceptance/windows-client.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $client = Select-String -Path artifacts/ssh-acceptance/windows-client.txt `
            -Pattern 'bsd_client_acceptance_loopback \.\.\. ok'
          $server = Select-String -Path artifacts/ssh-acceptance/windows-client.txt `
            -Pattern 'bsd_server_acceptance_loopback \.\.\. ok'
          if (-not $client -or -not $server) {
            Write-Output "::error title=SSH loopback (Windows)::验收用例未同时执行（零不等于通过）"
            exit 1
          }
          Write-Output "::notice title=SSH loopback (Windows)::GO（客户端与服务端回环用例均已执行）"

      - name: 上传 Windows SSH 回环验收记录
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssh-acceptance-windows
          if-no-files-found: warn
          path: artifacts/ssh-acceptance/

      - name: 入站 TLS 握手与证书专项（Check 282—285）
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/tls-ci | Out-Null
          cargo test --locked -p whcode-bin serve::tests 2>&1 |
            Tee-Object -FilePath artifacts/tls-ci/serve.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p whcode-bin tls::tests 2>&1 |
            Tee-Object -FilePath artifacts/tls-ci/tls.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $serveOk = Select-String -Path artifacts/tls-ci/serve.txt -Pattern '^test result: ok\.'
          $tlsOk = Select-String -Path artifacts/tls-ci/tls.txt -Pattern '^test result: ok\.'
          if (-not $serveOk -or -not $tlsOk) {
            Write-Output "::error title=TLS inbound (Windows)::缺少 test result: ok 行（零不等于通过）"
            exit 1
          }
          Write-Output "::notice title=TLS inbound (Windows)::GO（serve::tests 与 tls::tests 均通过）"

      - name: 上传 Windows TLS 专项记录
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tls-ci-windows
          if-no-files-found: warn
          path: artifacts/tls-ci/

      - name: Web tablist 键盘／RTL／焦点／ARIA（Check 294，真实浏览器）
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check playwright
          # 测试步骤只产出测试 harness；浏览器验收需要真实二进制。
          cargo build --locked -p whcode-bin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts/web-ui-ci | Out-Null
          $ws = Join-Path $env:RUNNER_TEMP "whcode-web-ui"
          New-Item -ItemType Directory -Force $ws | Out-Null
          # 让内核分配空闲端口，避免托管 runner 上固定端口冲突。
          $probe = [System.Net.Sockets.TcpListener]::new([Net.IPAddress]::Loopback, 0)
          $probe.Start()
          $port = $probe.LocalEndpoint.Port
          $probe.Stop()
          $server = Start-Process -FilePath "target/debug/whcode.exe" `
            -ArgumentList @("serve", "--web", "--bind", "127.0.0.1:$port", "--tls", "off", "--workspace", $ws) `
            -PassThru
          try {
            python .github/scripts/web-ui-check.py `
              --base-url "http://127.0.0.1:$port" `
              --evidence artifacts/web-ui-ci/summary.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Output "::notice title=Web tablist (Windows)::GO（键盘循环／RTL／焦点／ARIA 同步）"
          } finally {
            Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue
          }

      - name: 上传 Web tablist 浏览器证据
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-ui-ci-windows
          if-no-files-found: warn
          path: artifacts/web-ui-ci/

      - name: 运行时 feature 门控测试（T110／ADR-029：默认构建外再验引擎路径）
        if: matrix.platform == 'windows'
        run: |
          cargo test --locked -p whcode-runtime --lib --features runtime-js
          cargo clippy --locked -p whcode-runtime --lib --features runtime-js -- -D warnings

      - name: WebSocket 慢客户端对比（Check 199／209，独占执行）
        if: matrix.platform == 'windows'
        run: cargo test --locked -p whcode-bin slow_client_does_not_delay_other_subscribers -- --ignored --test-threads=1

      - name: 计数一致性（FR/任务/Check）
        if: matrix.platform == 'windows'
        run: python .github/scripts/check_counts.py

      - name: 三方追溯（FR↔任务↔Check，含缺口登记合规）
        if: matrix.platform == 'windows'
        run: python .github/scripts/traceability.py

      - name: 前端预算（FR-618／ADR-014）
        if: matrix.platform == 'windows'
        run: python .github/scripts/benchmarks/check-frontend-budget.py

      # ---------------- FreeBSD（最新 15.x release） ----------------
      - name: 在 FreeBSD VM 中构建、测试与记录
        id: freebsd_vm
        if: matrix.platform == 'freebsd' && github.event_name != 'pull_request'
        # ADR-013：BSD 只作平台证据；VM／引导失败不应把整次 CI 变红，
        # 结论仍由上传的证据文件与 check-run 注解承载（NO-GO 不改写）。
        continue-on-error: true
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          # 只写主版本：action 自动取最新 15.x 点版本。
          release: "15"
          usesh: true
          prepare: |
            pkg install -y curl cmake ninja python3
            pkg install -y duckdb || true
          run: |
            set -e
            mkdir -p artifacts/store-acceptance artifacts/ssh-acceptance
            progress=artifacts/store-acceptance/freebsd-progress.txt
            echo "phase=bootstrap-start" > "$progress"
            # 用 rustup 装锁定工具链（pkg 的 rust 版本不确定，无法满足可复现要求）。
            export HOME=/root
            export PATH="$HOME/.cargo/bin:$PATH"
            if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain 1.99.1
            fi
            rustc -vV
            cargo -V
            echo "phase=toolchain-ok" >> "$progress"
            echo "rustc_version=$(rustc --version)" >> "$progress"

            echo "=== 代码级检查（平台中立 crate，不链接 DuckDB／GUI）==="
            cargo check --locked -p whcode-domain -p whcode-platform -p whcode-speckit \
              -p whcode-llm -p whcode-runtime
            echo "phase=code-check-ok" >> "$progress"

            echo "=== 包级测试（不依赖 libduckdb 的 crate）==="
            cargo test --locked -p whcode-domain -p whcode-platform -p whcode-speckit \
              -p whcode-llm -p whcode-runtime
            echo "phase=package-tests-ok" >> "$progress"

            # Check 109／201 的 BSD 侧：进程组终止后孙进程零残留。退码 0 不足以判定，
            # 必须看到验收用例名；缺用例按 NO-GO 记录（零不等于通过）。
            echo "=== BSD 进程组零残留（Check 109／201）==="
            pg_log=/tmp/whcode-process-group.$$.log
            pg=NO-GO
            if cargo test --locked -p whcode-platform process_group_termination_kills_grandchild \
              -- --nocapture > "$pg_log" 2>&1 \
              && grep -q 'process_group_termination_kills_grandchild_and_leaves_no_residue ... ok' "$pg_log"; then
              pg=GO
            fi
            mkdir -p artifacts/process-group
            {
              echo "# WHCode BSD 进程组零残留（Check 109／201）"
              echo "format_version = 1"
              echo "platform = $(uname -s)"
              echo "test = process_group_termination_kills_grandchild_and_leaves_no_residue"
              echo "process_group_gate = $pg"
              echo "[cargo_output_tail]"
              tail -n 40 "$pg_log" 2>/dev/null || echo "<未取得证据：未执行>"
            } > artifacts/process-group/freebsd-process-group.txt
            rm -f "$pg_log"
            echo "process_group_gate=$pg" >> "$progress"

            # DuckDB 2.0.0 源码构建必须先于 SSH 与 store 冒烟：pkg 的 1.5.6 与冻结引擎
            # 2.0.0（ADR-034）主版本不一致，store 的引擎版本断言必然失败，SSH 测试也会
            # 链接到错误版本。脚本只记录不判定，NO-GO 不得改写为 GO。
            echo "=== DuckDB 2.0.0 源码构建与 store 冒烟（Check 22／ADR-034）==="
            sh .github/scripts/platform-matrix/bsd-duckdb.sh
            echo "phase=duckdb-script-done" >> "$progress"
            if [ -f artifacts/store-acceptance/freebsd-duckdb.env ]; then
              # shellcheck disable=SC1091
              . artifacts/store-acceptance/freebsd-duckdb.env
            fi

            echo "=== SSH 客户端＋服务端 BSD 回环验收（Check 25／96／99；V-004 仍延后）==="
            # 脚本始终退出 0，结论写在 artifacts/ssh-acceptance/<platform>-client.txt；
            # 不得以退出码代替阅读证据文件（NO-GO 不得改写为 GO）。
            sh .github/scripts/platform-matrix/bsd-ssh-client.sh
            echo "phase=ssh-script-done" >> "$progress"

            # DuckDB 环境选择：源码构建就绪时用它；否则退回 pkg（1.5.6），并保留
            # “版本不匹配属 R-01 现实化路径”的独立结论。依赖记录必须在选择之后执行，
            # 否则 record-deps.sh 取不到 DUCKDB_LIB_DIR（run 40159516841 即此情形）。
            duckdb_ready=0
            store_gate=NO-GO
            if [ "${WHCODE_DUCKDB_READY:-0}" = 1 ]; then
              duckdb_ready=1
              if grep -q '^store_gate = GO' artifacts/store-acceptance/freebsd-store.txt; then
                store_gate=GO
                echo "STORE_GATE_RESULT=GO（源码构建 DuckDB 2.0.0；store 冒烟已由 bsd-duckdb.sh 执行）"
              else
                echo "STORE_GATE_RESULT=NO-GO（源码构建就绪但 store 冒烟未通过，详见 freebsd-store.txt）"
              fi
              # whcode-bin 依赖 whcode-gui（iced→softbuffer），BSD 上不可构建，doctor 探针
              # 只会得到编译错误；显式跳过，引擎版本改用源码构建版本并在记录文件标注来源。
              export WHCODE_SKIP_RUNTIME_PROBE=1
            else
              echo "=== DuckDB 包校验（源码构建未就绪，退回 pkg）==="
              if pkg info duckdb >/dev/null 2>&1; then
                export DUCKDB_LIB_DIR=/usr/local/lib
                export DUCKDB_INCLUDE_DIR=/usr/local/include
                export LD_LIBRARY_PATH="/usr/local/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
                duckdb_ready=1
                echo "pkg DuckDB：$(pkg info duckdb | tr '\n' ' ')"
                export WHCODE_SKIP_RUNTIME_PROBE=1
              else
                echo "pkg 无 duckdb：依赖记录中 DuckDB 版本将标注未取得证据"
              fi

              echo "=== DuckDB store 冒烟（Check 22；独立于 GUI 编译结果）==="
              # 工作区级 `cargo test` 会编译 whcode-tests，其 dev 依赖含 whcode-gui，
              # GUI 编译失败（run 40159516841：25 errors）会短路 build/test，导致 whcode-store
              # 的建库／事务写读／关闭重启／迁移用例一个都没执行。store 冒烟因此单独先跑：
              # 它只依赖域层与 libduckdb，是 DuckDB 原生可用性的最小可判定集合；
              # 其结论不得被工作区级 NO-GO 掩盖或替代。
              if [ "$duckdb_ready" -eq 1 ] && cargo test --locked -p whcode-store; then
                store_gate=GO
                echo "STORE_GATE_RESULT=GO（whcode-store 建库/事务/重启/迁移用例已执行）"
              elif [ "$duckdb_ready" -eq 1 ]; then
                echo "STORE_GATE_RESULT=NO-GO（whcode-store 冒烟失败：版本或 ABI 不匹配，属 R-01 预期风险路径）"
              else
                echo "STORE_GATE_RESULT=NO-GO（pkg 无 duckdb：store 冒烟无法执行）"
              fi
            fi

            echo "=== 依赖记录（V-001，须在 DUCKDB_* 导出之后）==="
            mkdir -p artifacts
            sh .github/scripts/platform-matrix/record-deps.sh artifacts

            echo "=== DuckDB 原生 Go/No-Go（失败属 R-01 证据，不使 job 变红）==="
            if [ "$duckdb_ready" -eq 1 ]; then
              # 工作区级 gate 只回答“整棵工作区是否可构建/可测试”，与 store 冒烟是两段结论：
              # 它仍可能因 whcode-tests 的 GUI dev 依赖失败，故与 STORE_GATE_RESULT 分开记录。
              if [ "$store_gate" = GO ] && \
                cargo build --locked --workspace --exclude whcode-gui --exclude whcode-bin \
                && cargo test --locked --workspace --exclude whcode-gui --exclude whcode-bin; then
                echo "GATE_RESULT=GO"
              else
                echo "GATE_RESULT=NO-GO（工作区级构建/测试未通过；若 STORE_GATE_RESULT=GO，则此处失败来自 whcode-tests 的 GUI dev 依赖，不是 DuckDB ABI 结论）"
              fi
            else
              echo "GATE_RESULT=NO-GO（pkg 无 duckdb：需源码构建，待评估）"
            fi
            echo "phase=done" >> "$progress"

      - name: 归档 FreeBSD 结论
        if: always() && matrix.platform == 'freebsd' && github.event_name != 'pull_request'
        run: |
          echo "FreeBSD 绿路径：${{ steps.freebsd_vm.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "DuckDB Go/No-Go 见 VM 日志末尾；两者均只作平台证据，不进入验收结论。" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 FreeBSD 依赖记录
        if: always() && matrix.platform == 'freebsd' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deps-freebsd
          path: artifacts/deps-freebsd.txt

      - name: 上传 FreeBSD SSH 客户端验收记录
        if: always() && matrix.platform == 'freebsd' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssh-acceptance-freebsd
          if-no-files-found: warn
          path: artifacts/ssh-acceptance/

      - name: 上传 FreeBSD DuckDB 源码构建与 store 验收记录
        if: always() && matrix.platform == 'freebsd' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-acceptance-freebsd
          if-no-files-found: warn
          path: |
            artifacts/store-acceptance/
            artifacts/process-group/

      # ---------------- NetBSD（最新 11.x release） ----------------
      - name: 在 NetBSD VM 中构建、测试与记录
        id: netbsd_vm
        if: matrix.platform == 'netbsd' && github.event_name != 'pull_request'
        # 同 FreeBSD：BSD 平台证据不阻断 CI 绿路径（ADR-013）。
        continue-on-error: true
        uses: vmactions/netbsd-vm@c8a0d7ddb84619a7a8cc4e652efa7950b3fd9f92 # v1.5.2
        with:
          # 只写主版本：action 自动取最新 11.x 点版本；pkgin 仓库路径由 VM 的 uname -r 推导。
          release: "11"
          usesh: true
          prepare: |
            # 用户指令（2026-10-24）：NetBSD 不用 pkg_add，改为解压官方包引导 pkgin。
            # 一手依据：vmactions/netbsd-vm v1.5.2 README（prepare 以 sh 执行；示例用
            # pkg_add）；pkgin-26.4.0 仅含 bin/pkgin，运行时依赖 pkg_install>=20200701
            # 与 sqlite3>=3.51.1nb1；sqlite3-3.53.4 无运行时依赖。上一轮失败
            # （run 40076402536）是解压到 `/` 而非 pkgsrc 前缀，导致 pkgin 找不到
            # /usr/pkg/sbin/pkg_admin；本次统一解压到 /usr/pkg。
            # 仓库用主站 ftp.netbsd.org 的 amd64 路径：CDN 的 x86_64 边缘与 pkg_summary
            # 不同步（实测 curl/expat Not Found、cmake/rust size mismatch），主站摘要与
            # 文件一致。pkgin 的 $arch 宏会展开为 x86_64，故 repositories.conf 直接写 amd64。
            # 发行版号取自 VM 自身（uname -r），release 前缀升级到新点版本时无需改脚本。
            set -eu
            rel=$(uname -r)
            base="https://ftp.netbsd.org/pub/pkgsrc/packages/NetBSD/amd64/${rel}/All"
            work=/tmp/pkgin-bootstrap
            mkdir -p "$work" /usr/pkg
            cd "$work"
            ftp -V -o pkgin.tgz "${base}/pkgin-26.4.0.tgz"
            ftp -V -o sqlite3.tgz "${base}/sqlite3-3.53.4.tgz"
            ftp -V -o pkg_install.tgz "${base}/pkg_install-20260227.tgz"
            tar -xf pkgin.tgz -C /usr/pkg bin/pkgin
            tar -xf sqlite3.tgz -C /usr/pkg bin/sqlite3 lib
            tar -xf pkg_install.tgz -C /usr/pkg sbin
            mkdir -p /usr/pkg/etc/pkgin /var/db/pkgin
            printf '%s\n' "$base" > /usr/pkg/etc/pkgin/repositories.conf
            export PATH="/usr/pkg/sbin:/usr/pkg/bin:$PATH"
            export LD_LIBRARY_PATH="/usr/pkg/lib"
            pkgin -y update
            pkgin -y install rust cmake ninja
            # 实测（run 40515646118）：该仓库的 ninja 包是 IRC 客户端分支（--version
            # 输出非版本号），bsd-duckdb.sh 会探测并回退 Unix Makefiles，此时需要 gmake。
            pkgin -y install gmake || echo "WARN: gmake 安装失败（Makefiles 回退受限）"
            # python3／curl 缺失不阻断 bootstrap：DuckDB 源码构建会记录 NO-GO，
            # 但依赖记录与工具链检查仍应执行（区分“正确的空”与“前置缺失”）。
            pkgin -y install python3 || echo "WARN: python3 安装失败（DuckDB 源码构建将记录 NO-GO）"
            pkgin -y install curl || echo "WARN: curl 安装失败（rustup 下载将回退 pkgsrc）"
            # DuckDB 需要 C/C++ 编译器；NetBSD 的 VM 镜像默认没有 comp 集。
            # pkgsrc 的 gcc 包通常提供带版本号的可执行名（gcc12／g++12），
            # 不保证存在无后缀的 gcc／g++，因此两个名字都尝试安装。
            pkgin -y install gcc12 || pkgin -y install gcc || echo "WARN: 无可用 gcc（DuckDB 配置将记录 NO-GO）"
            # pkgsrc 的 gcc 包装器在部分 NetBSD 镜像上无法通过 CMake 的编译试验；
            # clang 是自包含工具链，作为优先候选可绕开该环境问题。
            pkgin -y install clang || echo "WARN: clang 安装失败（回退 gcc）"
            pkgin -y install python313 || true
            pkgin -y install duckdb || true
          run: |
            set -e
            export PATH="/usr/pkg/sbin:/usr/pkg/bin:$PATH"
            export LD_LIBRARY_PATH="/usr/pkg/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
            mkdir -p artifacts/store-acceptance artifacts/ssh-acceptance
            progress=artifacts/store-acceptance/netbsd-progress.txt
            echo "phase=bootstrap-start" > "$progress"

            # pkgsrc 的 rust 可能与锁定版本不一致（Check 21）。优先用 rustup 安装
            # rust-toolchain.toml 的版本；下载或安装失败时回退 pkgsrc rust，
            # 由下面的 MSRV 闸门显式 SKIP，不得用旧工具链冒充通过。
            export HOME=${HOME:-/root}
            if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
              echo "=== 尝试 rustup 安装锁定工具链 1.99.1（x86_64-unknown-netbsd）==="
              rustup_url=https://static.rust-lang.org/rustup/dist/x86_64-unknown-netbsd/rustup-init
              if command -v curl >/dev/null 2>&1; then
                curl -fsSL --retry 2 --connect-timeout 30 -o /tmp/rustup-init "$rustup_url" \
                  || rm -f /tmp/rustup-init
              elif command -v ftp >/dev/null 2>&1; then
                ftp -V -o /tmp/rustup-init "$rustup_url" 2>/dev/null || rm -f /tmp/rustup-init
              fi
              if [ -s /tmp/rustup-init ]; then
                chmod +x /tmp/rustup-init
                if /tmp/rustup-init -y --profile minimal --default-toolchain 1.99.1 \
                  >/tmp/rustup-init.log 2>&1; then
                  echo "rustup 安装完成"
                else
                  echo "rustup 安装失败；回退 pkgsrc rust"
                  tail -n 20 /tmp/rustup-init.log || true
                fi
              else
                echo "rustup-init 下载失败；回退 pkgsrc rust"
              fi
            fi
            # 只有 rustc 真能执行才前置 rustup 的 PATH；rustup-init 失败时可能留下
            # 不可用的 shim，前置它会让后续每一步都以 127／非零退出。
            if [ -x "$HOME/.cargo/bin/rustc" ] && \
              "$HOME/.cargo/bin/rustc" --version >/dev/null 2>&1; then
              export PATH="$HOME/.cargo/bin:$PATH"
              echo "phase=rustup-ok" >> "$progress"
            else
              echo "phase=rustup-fallback-pkgsrc" >> "$progress"
            fi
            rustc -vV
            cargo -V
            echo "rustc_version=$(rustc --version)" >> "$progress"

            # MSRV 从 Cargo.toml 读取：工作流手写版本会与清单漂移（2026-10-24 已升至 1.99），
            # 手写值一旦落后，pkgsrc rust 低于 MSRV 时不会跳过而是直接编译失败。
            msrv=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
            if [ -z "$msrv" ]; then
              echo "无法从 Cargo.toml 读取 rust-version" >&2
              exit 1
            fi
            version=$(rustc --version | awk '{print $2}')
            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            msrv_major=$(echo "$msrv" | cut -d. -f1)
            msrv_minor=$(echo "$msrv" | cut -d. -f2)
            # 这里只判定、不立即退出：依赖记录必须先于 SKIP 闸门执行，否则工具链低于
            # MSRV 时 deps-netbsd.txt 永不生成，上传步骤只能报 “No files were found”
            # （run 40159516841）。BSD 只作平台证据，依赖事实与代码结论分开记录。
            msrv_ok=1
            if [ "$major" -lt "$msrv_major" ] || \
              { [ "$major" -eq "$msrv_major" ] && [ "$minor" -lt "$msrv_minor" ]; }; then
              msrv_ok=0
              # 低于 MSRV 时 whcode-bin（依赖 GUI）无法构建，doctor 探针只会写入编译错误；
              # 显式跳过，运行期引擎版本退回 pkg_info duckdb 的版本（记录文件标注来源）。
              export WHCODE_SKIP_RUNTIME_PROBE=1
            fi

            echo "=== 依赖记录（V-001，先于 MSRV 闸门执行）==="
            mkdir -p artifacts
            # 包由 prepare 阶段安装（pkgin 装 duckdb，失败不阻断）；先导出库目录，
            # 记录脚本才能取到 DuckDB 版本类与载荷校验和，而不是占位符。
            export DUCKDB_LIB_DIR=/usr/pkg/lib
            export DUCKDB_INCLUDE_DIR=/usr/pkg/include
            sh .github/scripts/platform-matrix/record-deps.sh artifacts

            if [ "$msrv_ok" -eq 0 ]; then
              echo "SKIP：pkgsrc rust $version 低于 MSRV $msrv（环境限制，不作代码结论）"
              echo "本次仅产出依赖记录，不进入验收结论（ADR-013：BSD 只作平台证据）。"
              echo "phase=msrv-skip" >> "$progress"
              exit 0
            fi

            echo "=== 代码级检查（平台中立 crate，不链接 DuckDB／GUI）==="
            cargo check --locked -p whcode-domain -p whcode-platform -p whcode-speckit \
              -p whcode-llm -p whcode-runtime
            echo "phase=code-check-ok" >> "$progress"

            echo "=== 包级测试（不依赖 libduckdb 的 crate）==="
            cargo test --locked -p whcode-domain -p whcode-platform -p whcode-speckit \
              -p whcode-llm -p whcode-runtime
            echo "phase=package-tests-ok" >> "$progress"

            echo "=== BSD 进程组零残留（Check 109／201）==="
            pg_log=/tmp/whcode-process-group.$$.log
            pg=NO-GO
            if cargo test --locked -p whcode-platform process_group_termination_kills_grandchild \
              -- --nocapture > "$pg_log" 2>&1 \
              && grep -q 'process_group_termination_kills_grandchild_and_leaves_no_residue ... ok' "$pg_log"; then
              pg=GO
            fi
            mkdir -p artifacts/process-group
            {
              echo "# WHCode BSD 进程组零残留（Check 109／201）"
              echo "format_version = 1"
              echo "platform = $(uname -s)"
              echo "test = process_group_termination_kills_grandchild_and_leaves_no_residue"
              echo "process_group_gate = $pg"
              echo "[cargo_output_tail]"
              tail -n 40 "$pg_log" 2>/dev/null || echo "<未取得证据：未执行>"
            } > artifacts/process-group/netbsd-process-group.txt
            rm -f "$pg_log"
            echo "process_group_gate=$pg" >> "$progress"

            # 源码构建后才能让 store 的引擎版本断言与 SSH 链接路径成立。
            # CMake 不认“路径里有编译器但环境没声明”的情况；按可用名字显式导出。
            cc_name=""
            for candidate in clang gcc gcc12 gcc13 gcc14; do
              if command -v "$candidate" >/dev/null 2>&1; then cc_name="$candidate"; break; fi
            done
            cxx_name=""
            for candidate in clang++ g++ g++12 g++13 g++14; do
              if command -v "$candidate" >/dev/null 2>&1; then cxx_name="$candidate"; break; fi
            done
            if [ -n "$cc_name" ] && [ -n "$cxx_name" ]; then
              export CC="$cc_name" CXX="$cxx_name"
              echo "phase=compiler-$cc_name-$cxx_name" >> "$progress"
            else
              echo "phase=compiler-missing-${cc_name:-none}-${cxx_name:-none}" >> "$progress"
            fi
            echo "=== DuckDB 2.0.0 源码构建与 store 冒烟（Check 22／ADR-034）==="
            WHCODE_DUCKDB_JOBS=2 sh .github/scripts/platform-matrix/bsd-duckdb.sh
            echo "phase=duckdb-script-done" >> "$progress"
            if [ -f artifacts/store-acceptance/netbsd-duckdb.env ]; then
              # shellcheck disable=SC1091
              . artifacts/store-acceptance/netbsd-duckdb.env
            fi

            echo "=== SSH 客户端＋服务端 BSD 回环验收（Check 25／96／99）==="
            sh .github/scripts/platform-matrix/bsd-ssh-client.sh
            echo "phase=ssh-script-done" >> "$progress"

            echo "=== DuckDB 原生 Go/No-Go（失败属 R-01 证据，不使 job 变红）==="
            duckdb_ready=0
            if [ "${WHCODE_DUCKDB_READY:-0}" = 1 ]; then
              duckdb_ready=1
              if grep -q '^store_gate = GO' artifacts/store-acceptance/netbsd-store.txt; then
                echo "STORE_GATE_RESULT=GO（源码构建 DuckDB 2.0.0；store 冒烟已由 bsd-duckdb.sh 执行）"
              else
                echo "STORE_GATE_RESULT=NO-GO（源码构建就绪但 store 冒烟未通过，详见 netbsd-store.txt）"
              fi
            elif pkg_info duckdb >/dev/null 2>&1; then
              export DUCKDB_LIB_DIR=/usr/pkg/lib
              export DUCKDB_INCLUDE_DIR=/usr/pkg/include
              duckdb_ready=1
              if cargo test --locked -p whcode-store; then
                echo "STORE_GATE_RESULT=GO（pkgsrc DuckDB；store 冒烟用例已执行）"
              else
                echo "STORE_GATE_RESULT=NO-GO（pkgsrc DuckDB 与引擎主版本不一致，属 R-01 现实化路径）"
              fi
            else
              echo "STORE_GATE_RESULT=NO-GO（pkgsrc 无 DuckDB 包）"
            fi

            if [ "$duckdb_ready" -eq 1 ]; then
              if cargo build --locked --workspace --exclude whcode-gui --exclude whcode-bin \
                && cargo test --locked --workspace --exclude whcode-gui --exclude whcode-bin; then
                echo "GATE_RESULT=GO"
              else
                echo "GATE_RESULT=NO-GO（版本或 ABI 不一致时的预期风险路径）"
              fi
            else
              echo "GATE_RESULT=NO-GO（无可用 DuckDB 原生库）"
            fi
            echo "phase=done" >> "$progress"

      - name: 归档 NetBSD 结论
        if: always() && matrix.platform == 'netbsd' && github.event_name != 'pull_request'
        run: |
          echo "NetBSD 绿路径：${{ steps.netbsd_vm.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "若绿路径失败且原因是 pkgsrc rust 低于 MSRV，属环境限制。" >> "$GITHUB_STEP_SUMMARY"
          echo "DuckDB Go/No-Go 见 VM 日志末尾；两者均只作平台证据，不进入验收结论。" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 NetBSD 依赖记录
        if: always() && matrix.platform == 'netbsd' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deps-netbsd
          path: artifacts/deps-netbsd.txt

      - name: 上传 NetBSD DuckDB 源码构建与 store 验收记录
        if: always() && matrix.platform == 'netbsd' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-acceptance-netbsd
          if-no-files-found: warn
          path: |
            artifacts/store-acceptance/
            artifacts/process-group/

      - name: 上传 NetBSD SSH 客户端验收记录
        if: always() && matrix.platform == 'netbsd' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssh-acceptance-netbsd
          if-no-files-found: warn
          path: artifacts/ssh-acceptance/

      # check-run 注解是公开可读的机器证据（日志下载需登录）：把 store／SSH 判据行
      # 以 notice 形式附在 job 上，供无凭据复核；NO-GO 不改写、缺文件显式告警。
      - name: 公布 BSD 验收结论（公开注解）
        if: always() && matrix.platform != 'windows' && github.event_name != 'pull_request'
        run: |
          set -eu
          found=0
          for f in artifacts/store-acceptance/*-store.txt artifacts/ssh-acceptance/*-client.txt \
            artifacts/process-group/*-process-group.txt; do
            [ -f "$f" ] || continue
            found=1
            verdict=$(grep -m1 -E '^(store_gate|ssh_loopback_gate|process_group_gate) = ' "$f" || true)
            [ -n "$verdict" ] || verdict="<未取得判据行>"
            echo "::notice title=BSD evidence $(basename "$f")::$verdict"
            echo "$f：$verdict" >> "$GITHUB_STEP_SUMMARY"
            # NO-GO 时把失败测试名／错误行一并公开：日志下载需登录，只有结论没有
            # 失败点无法行动。
            if printf '%s' "$verdict" | grep -q 'NO-GO'; then
              detail=$(grep -aE '^test .* FAILED|^error(\[|:)|panicked at|not found|undefined' "$f" \
                | head -n 6 | tr '\n' ';' | cut -c1-600)
              if [ -n "${detail:-}" ]; then
                echo "::notice title=BSD failure $(basename "$f")::$detail"
              fi
              # 失败测试名之外，再公布 cargo 与构建日志的最后几行；日志下载需登录，
              # 只有结论无法定位是库版本、SONAME 还是某个断言。
              cargo_tail=$(awk '/^\[cargo_output\]/{flag=1;next} flag' "$f" | tail -n 4 \
                | tr '\n' ';' | cut -c1-600)
              if [ -n "${cargo_tail:-}" ]; then
                echo "::notice title=BSD cargo tail $(basename "$f")::$cargo_tail"
              fi
              build_tail=$(awk '/^\[build_output_tail\]/{flag=1;next} flag' "$f" | tail -n 10 \
                | tr '\n' ';' | cut -c1-1200)
              if [ -n "${build_tail:-}" ]; then
                echo "::notice title=BSD build tail $(basename "$f")::$build_tail"
              fi
            fi
            engine=$(grep -m1 '^engine_version = ' "$f" || true)
            if [ -n "${engine:-}" ]; then
              echo "::notice title=BSD engine $(basename "$f")::$engine"
            fi
          done
          # VM 步骤失败时日志不可匿名读取；进度文件是唯一可定位的阶段证据。
          for f in artifacts/store-acceptance/*-progress.txt; do
            [ -f "$f" ] || continue
            found=1
            stage=$(tr '\n' ';' < "$f" | cut -c1-600)
            echo "::notice title=VM progress $(basename "$f")::$stage"
          done
          # OpenBSD／DragonFly 的 VM 不把工作区文件同步回 runner（既有事实），
          # 它们缺证据属预期；只有 FreeBSD／NetBSD 缺证据才是需要告警的异常。
          if [ "$found" -eq 0 ] && { [ "${{ matrix.platform }}" = freebsd ] || [ "${{ matrix.platform }}" = netbsd ]; }; then
            echo "::warning title=BSD evidence （${{ matrix.platform }}）::未找到 store／ssh 证据或进度文件（相关步骤可能未执行）"
          fi

      # ---------------- OpenBSD（最新 8.x release） ----------------
      - name: 在 OpenBSD VM 中构建、测试与记录
        id: openbsd_vm
        if: matrix.platform == 'openbsd' && github.event_name != 'pull_request'
        # 同 FreeBSD：BSD 平台证据不阻断 CI 绿路径（ADR-013）。
        continue-on-error: true
        uses: vmactions/openbsd-vm@f1ca8bc8ecc5b6ef7218e5b914836e067e1546d3 # v1.4.9
        with:
          # 只写主版本：action 自动取最新 8.x 点版本。
          release: "8"
          prepare: |
            # ports 的 rust 版本随 OpenBSD 发行版走；缺失时 run 段会显式 SKIP 而不是失败。
            pkg_add rust || true
          run: |
            set -e
            if ! command -v rustc >/dev/null 2>&1; then
              echo "SKIP：ports 无 rust（环境限制，不作代码结论）"
              exit 0
            fi
            rustc -vV
            cargo -V

            msrv=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
            if [ -z "$msrv" ]; then
              echo "无法从 Cargo.toml 读取 rust-version" >&2
              exit 1
            fi
            version=$(rustc --version | awk '{print $2}')
            major=$(echo "$version" | cut -d. -f1)
            minor=$(echo "$version" | cut -d. -f2)
            msrv_major=$(echo "$msrv" | cut -d. -f1)
            msrv_minor=$(echo "$msrv" | cut -d. -f2)
            if [ "$major" -lt "$msrv_major" ] || \
              { [ "$major" -eq "$msrv_major" ] && [ "$minor" -lt "$msrv_minor" ]; }; then
              echo "SKIP：ports rust $version 低于 MSRV $msrv（环境限制，不作代码结论）"
              # 环境阻塞也要落成可定位证据（Check 99 要求未完成平台写明原因），
              # 但结论必须保持 NO-GO，不得用 job success 冒充验收。
              mkdir -p artifacts/ssh-acceptance
              {
                echo "# WHCode 内置 SSH 验收：OpenBSD 环境阻塞记录（Check 25／99）"
                echo "format_version = 1"
                echo "generated_at_utc = $(date -u '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || echo '<未取得证据>')"
                echo "[blocked]"
                echo "reason = ports rust $version 低于 MSRV $msrv"
                echo "[verdict]"
                echo "ssh_loopback_gate = NO-GO（ports rust $version 低于 MSRV $msrv，未执行）"
              } > artifacts/ssh-acceptance/openbsd-client.txt
              exit 0
            fi

            echo "=== 代码级检查（平台中立 crate，不链接 DuckDB／GUI）==="
            cargo check --locked -p whcode-domain -p whcode-platform -p whcode-speckit \
              -p whcode-llm -p whcode-runtime

            echo "=== 包级测试（不依赖 libduckdb 的 crate）==="
            cargo test --locked -p whcode-domain -p whcode-platform -p whcode-speckit \
              -p whcode-llm -p whcode-runtime

            echo "=== 依赖记录（V-001）==="
            sh .github/scripts/platform-matrix/record-deps.sh artifacts

            echo "=== SSH 客户端回环（Check 25／99；缺 libduckdb 时记录 NO-GO）==="
            sh .github/scripts/platform-matrix/bsd-ssh-client.sh

      - name: 归档 OpenBSD 结论
        if: always() && matrix.platform == 'openbsd' && github.event_name != 'pull_request'
        run: |
          echo "OpenBSD 绿路径：${{ steps.openbsd_vm.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "ports rust 低于 MSRV 时按环境限制 SKIP；本结果只作平台证据（ADR-013）。" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 OpenBSD 依赖记录
        if: always() && matrix.platform == 'openbsd' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deps-openbsd
          path: artifacts/deps-openbsd.txt

      - name: 上传 OpenBSD SSH 验收记录
        if: always() && matrix.platform == 'openbsd' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssh-acceptance-openbsd
          if-no-files-found: warn
          path: artifacts/ssh-acceptance/

      # ---------------- DragonFly（最新 6.4.2 release） ----------------
      # vmactions 无 dragonfly-vm（已核实 404），改用 cross-platform-actions；
      # 该 action 用 `cpa.sh` 辅助脚本在后续步骤里进入 VM，故拆成“启动 VM”与“VM 内执行”两步。
      - name: 启动 DragonFly VM
        id: dragonfly_vm
        if: matrix.platform == 'dragonfly' && github.event_name != 'pull_request'
        uses: cross-platform-actions/action@82668f1fbd89d9c99487604f822cbf6716f124d3 # v1.7.0
        with:
          operating_system: dragonflybsd
          architecture: x86-64
          # 该 action 的 version 不支持前缀匹配，必须写精确版本。
          version: "6.4.2"
          sync_files: true

      - name: 在 DragonFly 中构建、测试与记录
        if: matrix.platform == 'dragonfly' && github.event_name != 'pull_request'
        # 同 FreeBSD：BSD 平台证据不阻断 CI 绿路径（ADR-013）。
        continue-on-error: true
        shell: cpa.sh {0}
        run: |
          set -e
          if command -v pkg >/dev/null 2>&1; then
            # 不同 BSD 上该 action 的默认用户不同（runner 或 root）：先直接试，再退 sudo；
            # 两条都失败不中止——rust 缺失由下面的显式 SKIP 汇报。
            pkg update -f >/dev/null 2>&1 || sudo pkg update -f >/dev/null 2>&1 || true
            pkg install -y rust || sudo pkg install -y rust || true
          fi
          if ! command -v rustc >/dev/null 2>&1; then
            echo "SKIP：dports 无 rust（环境限制，不作代码结论）"
            exit 0
          fi
          rustc -vV
          cargo -V

          msrv=$(sed -n 's/^rust-version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n1)
          if [ -z "$msrv" ]; then
            echo "无法从 Cargo.toml 读取 rust-version" >&2
            exit 1
          fi
          version=$(rustc --version | awk '{print $2}')
          major=$(echo "$version" | cut -d. -f1)
          minor=$(echo "$version" | cut -d. -f2)
          msrv_major=$(echo "$msrv" | cut -d. -f1)
          msrv_minor=$(echo "$msrv" | cut -d. -f2)
          if [ "$major" -lt "$msrv_major" ] || \
            { [ "$major" -eq "$msrv_major" ] && [ "$minor" -lt "$msrv_minor" ]; }; then
            echo "SKIP：dports rust $version 低于 MSRV $msrv（环境限制，不作代码结论）"
            # 环境阻塞落成证据（Check 99），结论保持 NO-GO。
            mkdir -p artifacts/ssh-acceptance
            {
              echo "# WHCode 内置 SSH 验收：DragonFly 环境阻塞记录（Check 25／99）"
              echo "format_version = 1"
              echo "generated_at_utc = $(date -u '+%Y-%m-%dT%H:%M:%SZ' 2>/dev/null || echo '<未取得证据>')"
              echo "[blocked]"
              echo "reason = dports rust $version 低于 MSRV $msrv"
              echo "[verdict]"
              echo "ssh_loopback_gate = NO-GO（dports rust $version 低于 MSRV $msrv，未执行）"
            } > artifacts/ssh-acceptance/dragonfly-client.txt
            exit 0
          fi

          echo "=== 代码级检查（平台中立 crate，不链接 DuckDB／GUI）==="
          cargo check --locked -p whcode-domain -p whcode-platform -p whcode-speckit \
            -p whcode-llm -p whcode-runtime

          echo "=== 包级测试（不依赖 libduckdb 的 crate）==="
          cargo test --locked -p whcode-domain -p whcode-platform -p whcode-speckit \
            -p whcode-llm -p whcode-runtime

          echo "=== 依赖记录（V-001）==="
          sh .github/scripts/platform-matrix/record-deps.sh artifacts

          echo "=== SSH 客户端回环（Check 25／99；缺 libduckdb 时记录 NO-GO）==="
          sh .github/scripts/platform-matrix/bsd-ssh-client.sh

      - name: 归档 DragonFly 结论
        if: always() && matrix.platform == 'dragonfly' && github.event_name != 'pull_request'
        run: |
          echo "DragonFly 绿路径：${{ steps.dragonfly_vm.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "dports rust 低于 MSRV 时按环境限制 SKIP；本结果只作平台证据（ADR-013）。" >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 DragonFly 依赖记录
        if: always() && matrix.platform == 'dragonfly' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deps-dragonfly
          path: artifacts/deps-dragonfly.txt

      - name: 上传 DragonFly SSH 验收记录
        if: always() && matrix.platform == 'dragonfly' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ssh-acceptance-dragonfly
          if-no-files-found: warn
          path: artifacts/ssh-acceptance/

  measurements:
    # PR 只跑构建与功能测试；测量在 push main 与手动触发时执行，避免每个 PR 消耗 6 小时配额
    # 与 runner 环境差异造成不可归因的预算波动。
    if: github.event_name != 'schedule' && github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 工作流语义门禁
        run: python .github/scripts/check-workflows.py

      - name: CI action 版本门禁（最新版本 + 固定 SHA）
        run: python .github/scripts/check-actions.py

      - name: 拉取并校验预编译 DuckDB（ADR-DB-BUILD）
        run: python .github/scripts/fetch-duckdb.py

      - name: 安装测量夹具依赖（Python duckdb 2.0.0，与引擎对齐）
        run: python -m pip install --disable-pip-version-check duckdb==2.0.0

      - name: 构建（锁定依赖图）
        run: cargo build --locked --workspace

      - name: 写者服务并发压力实验（T034/ADR-017）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/stability-ci | Out-Null
          cargo test --locked -p whcode-tests --test writer_stress -- --ignored --nocapture 2>&1 |
            Tee-Object -FilePath artifacts/stability-ci/writer_stress.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: DuckDB 内存上限基线实验（ADR-012）
        shell: pwsh
        run: |
          cargo test --locked -p whcode-tests --test memory_limit -- --ignored --nocapture 2>&1 |
            Tee-Object -FilePath artifacts/stability-ci/memory_limit.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 查询计划基准实验（T036/§7.2）
        shell: pwsh
        run: |
          cargo test --locked -p whcode-tests --test query_plan -- --ignored --nocapture 2>&1 |
            Tee-Object -FilePath artifacts/stability-ci/query_plan.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: NFR-203/NFR-206 测量夹具（ADR-025 冻结预算）
        shell: pwsh
        run: |
          cargo test --locked -p whcode-tests --test nfr_budget nfr203 -- --ignored --nocapture 2>&1 |
            Tee-Object -FilePath artifacts/stability-ci/nfr_budget.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p whcode-tests --test nfr_budget nfr206 -- --ignored --nocapture 2>&1 |
            Tee-Object -FilePath artifacts/stability-ci/nfr_budget.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: NFR-201/202 真实进程测量（serve 口径；控制台类 NFR-205/206 归桌面 job）
        shell: pwsh
        run: |
          python .github/scripts/benchmarks/measure-nfr-budgets.py --only nfr201,nfr202 2>&1 |
            Tee-Object -FilePath artifacts/stability-ci/nfr_real_process.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 长跑采集器冒烟（30 秒 / 5 秒采样，不作 24 h 结论）
        shell: pwsh
        env:
          WHCODE_STABILITY_SECONDS: "30"
          WHCODE_STABILITY_INTERVAL_SECS: "5"
          WHCODE_STABILITY_DIR: artifacts/stability-ci/smoke-workspace
          WHCODE_STABILITY_OUT: artifacts/stability-ci/timeseries.jsonl
        run: |
          cargo test --locked -p whcode-tests --test stability_run -- --ignored --nocapture 2>&1 |
            Tee-Object -FilePath artifacts/stability-ci/stability_run_smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 上传实验产物
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-measurements
          if-no-files-found: warn
          path: |
            artifacts/stability-ci/*.log
            artifacts/stability-ci/timeseries.jsonl
            artifacts/writer-service-stress.json
            artifacts/memory-limit-experiment.json
            artifacts/query-plan-report.json
            artifacts/nfr-budget-report.json
            artifacts/resource-report.json

  # ---------------- 性能预算（仅 workflow_dispatch 且 perf=true） ----------------
  # 托管 runner 为共享环境，绝对延迟受邻居负载影响；本 job 只产出受控测量信号，
  # 冻结预算的通过/否决仍以独占复跑与 ADR-025 口径为准，不用本 job 放宽预算。
  perf-budget:
    if: github.event_name == 'workflow_dispatch' && inputs.perf
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 工作流语义门禁
        run: python .github/scripts/check-workflows.py

      - name: 拉取并校验预编译 DuckDB
        run: python .github/scripts/fetch-duckdb.py

      - name: 构建（锁定依赖图）
        run: cargo build --locked --workspace

      - name: NFR-207/NFR-209 性能预算（串行独占）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/perf-ci | Out-Null
          cargo test --locked -p whcode-tests --test nfr_budget nfr207 -- --ignored --nocapture 2>&1 |
            Tee-Object -FilePath artifacts/perf-ci/nfr207.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p whcode-tests --test nfr_budget nfr209 -- --ignored --nocapture 2>&1 |
            Tee-Object -FilePath artifacts/perf-ci/nfr209.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 概览查询 p95 预算（Check 136／ADR-025，串行独占）
        shell: pwsh
        run: |
          cargo test --locked -p whcode-tests --test overview_perf -- --ignored --nocapture 2>&1 |
            Tee-Object -FilePath artifacts/perf-ci/overview-p95.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 测试进程资源铁律（session_switch RSS/CPU）
        shell: pwsh
        run: |
          python .github/scripts/benchmarks/measure-resources.py --test session_switch 2>&1 |
            Tee-Object -FilePath artifacts/perf-ci/resource_budget.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 上传性能测量产物
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perf-budget
          if-no-files-found: warn
          path: |
            artifacts/perf-ci/*.log
            artifacts/resource-report.json

  # ---------------- 桌面型测试（仅 workflow_dispatch 且 desktop=true） ----------------
  # 托管 runner 运行在非交互会话：窗口可创建，但屏幕捕获可能是黑屏或受 session 0 限制。
  # 本 job 提供 CI 入口与报告；失败即信号，不用 continue-on-error 掩盖。真实桌面结论仍以
  # 交互式控制台人工证据为准（V-003、FR-714）。
  desktop:
    if: github.event_name == 'workflow_dispatch' && inputs.desktop
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 工作流语义门禁
        run: python .github/scripts/check-workflows.py

      - name: 拉取并校验预编译 DuckDB
        run: python .github/scripts/fetch-duckdb.py

      - name: 安装截图依赖（Pillow；requirements-dev.txt）
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: 发布构建
        run: cargo build --release --locked -p whcode-bin

      - name: GUI 探针（四主题／按键／空闲资源）
        run: python .github/scripts/gui-probe.py --exe target/release/whcode.exe --out artifacts/gui-run-ci

      - name: NFR-205/206 控制台与流式 CPU 测量（headless 口径）
        run: python .github/scripts/benchmarks/measure-nfr-budgets.py --only nfr205,nfr206 --skip-build

      - name: 上传 GUI 证据
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gui-probe
          if-no-files-found: warn
          path: artifacts/gui-run-ci/

  # ---------------- action 版本联网审计（仅 schedule） ----------------
  action-audit:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 联网复核 action 是否为最新版本（清单 + 固定 SHA）
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check-actions.py --online
