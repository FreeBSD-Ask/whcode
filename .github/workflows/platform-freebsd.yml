# FreeBSD 平台构建、测试与依赖记录（tasks.md T005/T020；V-001、V-002、V-004）
#
# 运行策略（2026-10-24 用户指令，见 ADR-013 修订记录）：
#   - 随 main 分支 push 自动运行；workflow_dispatch 保留。OpenBSD/DragonFly 无原生
#     测试，保持手工占位。
#   - 结果只作**平台证据**，不进入验收结论；唯一验收目标仍是 Windows 11 amd64（ADR-013）。
#   - GitHub 不提供 FreeBSD runner，故在 ubuntu-latest 的 vmactions VM 中真实执行。
#
# 工具链（D-01 修订）：不使用 pkg 的 rust（版本由 ports 决定，可能低于 MSRV），改用
# rustup 安装 rust-toolchain.toml 锁定的 1.99.1。
#
# 绿路径（必过）：平台中立 crate 的 `cargo check` + 包级测试，不依赖 libduckdb／GUI 后端。
#   - `whcode-gui` 依赖 iced/softbuffer，后者没有 FreeBSD 后端（GUI v1 仅 Windows，ADR-027），
#     故不进入 BSD 绿路径；`whcode-bin` 因依赖 GUI 一并排除。
#   - 含 DuckDB／OpenSSL 等原生依赖的 crate（store/app/web/tui/ssh 等）归入 Go/No-Go 门禁；
#     门禁失败是显式证据（R-01），不把 job 变红。
#
# 环境变量契约（ADR-DB-BUILD）：外部 shell 环境变量优先于 .cargo/config.toml 的 [env] 表；
# 导出 DUCKDB_LIB_DIR=/usr/local/lib 与 DUCKDB_INCLUDE_DIR=/usr/local/include 即切换系统库。
name: platform-freebsd

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-test-deps-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 在 FreeBSD VM 中构建、测试与记录
        id: vm
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          usesh: true
          prepare: |
            pkg install -y curl cmake ninja
            pkg install -y duckdb || true
          run: |
            set -e
            # 用 rustup 装锁定工具链（pkg 的 rust 版本不确定，无法满足可复现要求）。
            export HOME=/root
            export PATH="$HOME/.cargo/bin:$PATH"
            if [ ! -x "$HOME/.cargo/bin/cargo" ]; then
              curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain 1.99.1
            fi
            rustc -vV
            cargo -V

            echo "=== 代码级检查（平台中立 crate，不链接 DuckDB／GUI）==="
            cargo check --locked -p whcode-domain -p whcode-platform -p whcode-speckit \
              -p whcode-llm -p whcode-runtime

            echo "=== 包级测试（不依赖 libduckdb 的 crate）==="
            cargo test --locked -p whcode-domain -p whcode-platform -p whcode-speckit \
              -p whcode-llm -p whcode-runtime

            echo "=== 依赖记录（V-001）==="
            sh ci/platform-matrix/record-deps.sh artifacts

            echo "=== DuckDB 原生 Go/No-Go（失败属 R-01 证据，不使 job 变红）==="
            if pkg info duckdb >/dev/null 2>&1; then
              export DUCKDB_LIB_DIR=/usr/local/lib
              export DUCKDB_INCLUDE_DIR=/usr/local/include
              echo "pkg DuckDB 版本：$(pkg info duckdb | tr '\n' ' ')"
              if cargo build --locked --workspace --exclude whcode-gui --exclude whcode-bin \
                && cargo test --locked --workspace --exclude whcode-gui --exclude whcode-bin; then
                echo "GATE_RESULT=GO"
              else
                echo "GATE_RESULT=NO-GO（版本或 ABI 不匹配，属 R-01 预期风险路径）"
              fi
            else
              echo "GATE_RESULT=NO-GO（pkg 无 duckdb：需源码构建，待评估）"
            fi

      - name: 归档结论
        if: always()
        run: |
          echo "FreeBSD 绿路径：${{ steps.vm.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "DuckDB Go/No-Go 见 VM 日志末尾；两者均只作平台证据，不进入验收结论。" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: deps-freebsd
          path: artifacts/deps-freebsd.txt

      # TODO：数据库冒烟（V-002）四步必须在门禁 GO 后于本平台真实运行；
      # TODO：SSH 服务端验收（V-004，M7/T096—T099）——公钥认证 / 会话隔离 / resize / 安全退出。
