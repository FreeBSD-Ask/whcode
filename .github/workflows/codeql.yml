# Code Scanning（advanced setup，2026-11-28 用户指令：default setup → 仓库自管工作流）。
#
# 背景：default setup 由 GitHub 托管，规则与模型随 GitHub 侧推送更新（2026-11-28 一次
# 更新批量产生 683 条 open 告警，版本与查询集不可由仓库控制）。advanced setup 把
# CodeQL 版本收进本仓库 CI 铁律（§5.1：最新 release + 固定 commit SHA），与
# check-actions.py／check-workflows.py 门禁同源，分析行为可审计、可复现。
#
# 语言对齐 default setup 的覆盖面（不缩水）：rust（主代码）＋ javascript（whcode-web
# 前端静态资产）＋ actions（工作流安全查询）。仓库无 TypeScript 源文件，故 javascript
# 分析同时覆盖 js 与 ts 后缀。
#
# category 与 default setup 原分析完全一致（/language:rust、
# /language:javascript-typescript、/language:actions）：GitHub 以「同一 category 的新
# 分析不再报告」关闭旧告警——这是「代码修复 + 重新分析消除」的合法路径，不是 dismiss。
#
# 查询集 security-extended 对齐 default setup 的 query_suite=extended；威胁模型为
# advanced setup 默认 remote（收窄经用户批准，见 ADR-103／AGENTS §5.2）。
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每周一 02:00 UTC，与 default setup 的 weekly 节奏对齐。
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  analyze:
    name: analyze-${{ matrix.language }}
    runs-on: windows-latest
    timeout-minutes: 120
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: rust
            category: /language:rust
            build_mode: none
          - language: javascript
            category: /language:javascript-typescript
          - language: actions
            category: /language:actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 工作流语义门禁
        run: python .github/scripts/check-workflows.py

      - name: CI action 版本门禁（最新版本 + 固定 SHA）
        run: python .github/scripts/check-actions.py

      # rust 的 build-mode none 无需工具链与 DuckDB 载荷；其余语言的提取也不构建。
      - name: 安装 llvm-mingw 与 gnullvm 工具链（仅 rust）
        if: matrix.language == 'rust'
        run: python .github/scripts/setup-windows-llvm.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 拉取 DuckDB 载荷（仅 rust）
        if: matrix.language == 'rust'
        run: python .github/scripts/fetch-duckdb.py

      - uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          # build-mode 仅对 rust 显式声明（js/actions 不接受该输入，空值按未设置处理）。
          build-mode: ${{ matrix.build_mode }}
          queries: security-extended

      - uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: ${{ matrix.category }}
