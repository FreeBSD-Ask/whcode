# Dependabot 配置（2026-10-24）：每日检查 Rust 依赖与 GitHub Actions。
#
# 纪律：
# 1. 只开 PR，不配置自动合并——核心依赖（DuckDB、russh、iced 等）的大版本升级
#    仍须按 ADR 与人工复核推进（AGENTS.md §4、§5 G2）；
# 2. minor/patch 归组以减少 PR 噪声；major 单独成 PR，便于逐项评估 MSRV、
#    unsafe 面与许可证影响；
# 3. 发布口径仍以 Cargo.lock 与 `--locked` 构建为准；Dependabot 只提案，
#    不改变冻结预算、平台范围与安全默认值。
# 4. Actions 升级 PR 必须同步 `.github/scripts/action-versions.json`（运行
#    `python .github/scripts/check-actions.py --update`）与工作流中的版本注释，否则
#    离线门禁失败（AGENTS.md §5.1：最新版本 + 固定 SHA）。
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # DuckDB 引擎升级必须人工按 docs/adr/ADR-DB-BUILD.md 处理：crate 版本与
      # fetch-duckdb.py 的归档/SHA256、DUCKDB_LIB_DIR、冒烟主版本断言必须同步修改，
      # 自动提 PR 只会产生“crate 与 DLL 错配”的不可构建提交。
      - dependency-name: "duckdb"
      - dependency-name: "libduckdb-sys"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
