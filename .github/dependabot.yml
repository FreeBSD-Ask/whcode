# Dependabot 配置（2026-10-24）：每日检查 Rust 依赖与 GitHub Actions。
#
# 纪律：
# 1. 只开 PR，不配置自动合并——核心依赖（DuckDB、russh、iced 等）的大版本升级
#    仍须按 ADR 与人工复核推进（AGENTS.md §4、§5 G2）；
# 2. minor/patch 归组以减少 PR 噪声；major 单独成 PR，便于逐项评估 MSRV、
#    unsafe 面与许可证影响；
# 3. 发布口径仍以 Cargo.lock 与 `--locked` 构建为准；Dependabot 只提案，
#    不改变冻结预算、平台范围与安全默认值。
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
